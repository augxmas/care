<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전문 외국환자관리 CRM</title><link rel="stylesheet" href="/css/common.css"><script src="/js/alert.js"></script><script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
body{margin:0;background:#f6f7f9;color:#18181b;font-family:Arial,sans-serif}.top{height:62px;background:#050505;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4%;position:sticky;top:0;z-index:1100}.top a{color:#fff;text-decoration:none}.section-tabs{height:62px;display:flex;align-items:flex-end;padding:0 5%;border-bottom:1px solid #d4d4d8;position:sticky;top:62px;z-index:1000;background:#f6f7f9}.section-tabs a{padding:18px 32px 14px;color:#52525b;text-decoration:none;font-weight:700;border-bottom:3px solid transparent}.section-tabs a.active{color:#111;background:#eee;border-bottom-color:#111}.wrap{width:90%;margin:26px auto}.head,.filters,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.card{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:18px;margin-bottom:16px}.filters{justify-content:flex-start;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:11px;font-weight:700}input,select{height:38px;border:1px solid #d4d4d8;border-radius:7px;padding:0 10px}.btn{border:1px solid #d4d4d8;border-radius:7px;padding:9px 14px;background:#fff;color:#18181b;cursor:pointer;text-decoration:none}.black{background:#111;color:#fff}.green{background:#15803d;color:#fff}.red{background:#b91c1c;color:#fff}.column-btn{color:#2563eb;border-color:#93b4ff}.right-actions{margin-left:auto;margin-top:15px;height:38px;display:flex;gap:10px}.right-actions .btn{height:38px;box-sizing:border-box}table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;font-size:13px}th,td{padding:11px;border-bottom:1px solid #e4e4e7;text-align:left;white-space:nowrap;background:#fff}th{background:#fafafa;position:sticky;top:0;z-index:2}.frozen{position:sticky!important;z-index:3;box-shadow:2px 0 3px #0001}.frozen.header{z-index:5}.badge{padding:4px 8px;border-radius:20px;font-size:11px}.pending{background:#fef3c7}.approved{background:#dcfce7}.rejected{background:#fee2e2}.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:1200;align-items:center;justify-content:center}.overlay.open{display:flex!important;opacity:1!important;pointer-events:auto!important;visibility:visible!important}.dialog{background:#fff;border-radius:12px;width:min(850px,95vw);max-height:90vh;overflow:auto;padding:24px}.register-dialog,.detail-dialog{width:min(960px,96vw);height:90vh;max-height:90vh;padding:0;overflow:hidden;display:flex;flex-direction:column}.modal-head{height:64px;min-height:64px;flex:none;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #ddd;background:#fff}.modal-head h2{margin:0;text-align:center}.modal-body{flex:1;min-height:0;overflow-y:auto;padding:24px}.register-dialog .modal-body{padding:0;overflow:hidden}.modal-body iframe{width:100%;height:100%;border:0}.modal-foot{height:68px;min-height:68px;flex:none;display:flex;align-items:center;justify-content:center;gap:10px;border-top:1px solid #ddd;background:#fff}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.edit-field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.edit-field input{width:100%;box-sizing:border-box}.edit-field input.invalid{border-color:#dc2626;background:#fef2f2}.input-row{display:flex;gap:7px}.input-row input{flex:1;min-width:0}.validation-error{display:none;color:#dc2626;font-size:11px;margin-top:5px}.validation-error.visible{display:block}.bank-list{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.bank-list button{padding:12px}.column-row{display:grid;grid-template-columns:28px minmax(130px,1fr) 90px 230px 90px;gap:10px;align-items:center;padding:10px;border:1px solid #e4e4e7;border-radius:8px;margin:7px 0}.column-row.dragging{opacity:.45}.drag{cursor:grab}.align-options{display:flex;gap:8px;font-size:12px}.span2{grid-column:span 2}@media(max-width:700px){.edit-grid{grid-template-columns:1fr}.span2{grid-column:auto}.bank-list{grid-template-columns:repeat(2,1fr)}}
.hospital-count-btn{min-width:42px;padding:5px 10px;color:#2563eb;border:1px solid #93b4ff;border-radius:15px;background:#eff6ff;cursor:pointer;font-weight:700}.hospital-status-grid{overflow:auto;max-height:58vh;margin-top:18px}.hospital-status-grid table{width:100%;min-width:850px}.hospital-empty{text-align:center;color:#71717a;padding:32px}.consent-edit{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;grid-column:span 2;padding:14px;border:1px solid #e4e4e7;border-radius:8px;background:#fafafa}.consent-edit label{display:flex;align-items:center;gap:8px}.consent-edit input{width:17px;height:17px}.consent-yes{color:#15803d;font-weight:700}.consent-no{color:#71717a}.password-note{font-size:11px;color:#71717a;margin-top:5px}
</style></head><body>
<header class="top"><a href="/supervisor/dashboard"><b>SUPERVISOR　모노라마 병원 CRM 시스템</b></a><strong>대행사관리</strong><button class="btn" id="logoutBtn">로그아웃</button></header>
<nav class="section-tabs"><a href="/supervisor/hospitals">병원관리</a><a class="active" href="/supervisor/agencies">대행사관리</a><a href="/supervisor/dashboard">캠페인관리</a><a href="/supervisor/dashboard?tab=stats">현황</a></nav>
<main class="wrap"><div class="head"><div><h1>대행사관리</h1><p>등록폼으로 접수된 대행사와 승인 상태를 관리합니다.</p></div><a class="btn" href="/supervisor/agency-form-builder">등록폼 설정</a></div>
<section class="card"><div class="filters"><div class="field"><label>대행사명</label><input id="company" placeholder="대행사명 검색"></div><div class="field"><label>상태</label><select id="status"><option value="">전체</option><option value="pending">승인요청</option><option value="approved">승인</option><option value="rejected">반려</option></select></div><div id="dynamicFilters" class="filters"></div><div class="right-actions"><button class="btn black" id="searchBtn">조회</button><button class="btn" id="registerBtn">대행사등록</button><button class="btn column-btn" id="columnBtn">▦ 컬럼조정</button></div></div></section>
<section class="card" style="overflow:auto"><h3>대행사 목록</h3><table><thead><tr id="gridHead"></tr></thead><tbody id="rows"></tbody></table></section></main>
<div class="overlay" id="registerOverlay"><div class="dialog register-dialog"><div class="modal-head"><h2>대행사등록</h2></div><div class="modal-body"><iframe id="registerFrame" src="/agency-register?embed=1"></iframe></div><div class="modal-foot"><button class="btn close">닫기</button><button class="btn black" id="submitRegister">대행사 등록 신청</button></div></div></div>
<div class="overlay" id="detailOverlay"><div class="dialog detail-dialog"><div class="modal-head"><h2>대행사 상세</h2></div><div class="modal-body"><form id="form"><input type="hidden" id="id"><div class="edit-grid" id="fields"></div></form></div><div class="modal-foot"><button type="button" class="btn close">닫기</button><button type="button" class="btn red" id="rejectBtn">반려</button><button type="button" class="btn green" id="approveBtn">승인</button><button type="submit" form="form" class="btn black">정보 저장</button></div></div></div>
<div class="overlay" id="bankOverlay"><div class="dialog" style="max-width:520px"><div class="head"><h2>은행 선택</h2><button type="button" class="btn close">닫기</button></div><div class="bank-list" id="bankList"></div></div></div>
<div class="overlay" id="columnOverlay"><div class="dialog" style="max-width:850px"><div class="head"><div><h2>Grid 컬럼조정</h2><p>컬럼 표시, 순서, 정렬과 틀고정을 지정하세요.</p></div><button class="btn close">닫기</button></div><div id="columnList"></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn" id="columnResetBtn">초기화</button><button class="btn black" id="columnSaveBtn">적용</button></div></div></div>
<div class="overlay" id="hospitalsOverlay"><div class="dialog" style="width:min(1050px,96vw)"><div class="head"><div><h2>연계 병원 현황</h2><p id="hospitalsCaption" style="margin:5px 0 0;color:#71717a"></p></div><button type="button" class="btn close">닫기</button></div><div class="hospital-status-grid"><table><thead><tr><th>병원명</th><th>사업자등록번호</th><th>일련번호</th><th>진료과목</th><th>대표전화</th><th>병원 상태</th><th>연계일</th></tr></thead><tbody id="hospitalRows"></tbody></table><p class="hospital-empty" id="hospitalEmpty" style="display:none">관리 중인 병원이 없습니다.</p></div></div></div>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),labels={company_name:'대행사명',company_name_en:'대행사명(en)',ceo_name:'대표자',business_no:'사업자등록번호',contact_phone:'대표전화',address1:'주소1',address2:'주소2',postal_code:'우편번호',contact_name:'담당자명',contact_mobile:'담당자 모바일폰',contact_email:'담당자 이메일',bank_name:'은행',bank_account:'계좌번호'},keys=Object.keys(labels),statusLabel={pending:'승인요청',approved:'승인',rejected:'반려',terminated:'종료'};
const gridLabels={...labels,hospital_count:'병원(개)',terms_consent:'이용약관동의',privacy_consent:'개인정보수집이용동의',push_consent:'알림수신동의',email_consent:'이메일수신동의',created_at:'등록일',approved_at:'승인일',status:'상태',actions:'관리'},defaultGridKeys=['company_name','company_name_en','ceo_name','business_no','hospital_count','bank_name','bank_account','contact_name','contact_email','terms_consent','privacy_consent','push_consent','email_consent','created_at','approved_at','status','actions'];let gridRows=[],columns=[];
function defaultColumns(){return defaultGridKeys.map(key=>({key,visible:true,align:['hospital_count','terms_consent','privacy_consent','push_consent','email_consent','status','actions'].includes(key)?'center':'left',frozen:false}))}
function loadColumns(){try{const saved=JSON.parse(localStorage.getItem('agencyGridColumns')||'[]'),valid=new Set(defaultGridKeys);columns=Array.isArray(saved)?saved.filter(c=>valid.has(c.key)):[]}catch{columns=[]}defaultColumns().forEach(c=>{if(!columns.some(x=>x.key===c.key))columns.push(c)});columns=columns.map(c=>({...c,visible:c.visible!==false,frozen:!!c.frozen,align:['left','center','right'].includes(c.align)?c.align:'left'}))}
function gridValue(row,key){if(key==='created_at'||key==='approved_at')return String(row[key]||'').slice(0,10)||'-';if(key==='hospital_count')return `<button type="button" class="hospital-count-btn" onclick="openAgencyHospitals(${row.id})">${Number(row.hospital_count)||0}</button>`;if(['terms_consent','privacy_consent','push_consent','email_consent'].includes(key))return row[key]?'<span class="consent-yes">동의</span>':'<span class="consent-no">미동의</span>';if(key==='status')return `<span class="badge ${row.status}">${statusLabel[row.status]||row.status}</span>`;if(key==='actions')return `<button class="btn" onclick="openAgency(${row.id})">관리</button>`;return esc(row[key]||'-')}
function renderGrid(){const shown=columns.filter(c=>c.visible);$('gridHead').innerHTML=shown.map(c=>`<th data-key="${c.key}" class="${c.frozen?'frozen header':''}" style="text-align:${c.align}">${gridLabels[c.key]}</th>`).join('');$('rows').innerHTML=gridRows.map(row=>`<tr>${shown.map(c=>`<td data-key="${c.key}" class="${c.frozen?'frozen':''}" style="text-align:${c.align}">${gridValue(row,c.key)}</td>`).join('')}</tr>`).join('');requestAnimationFrame(applyFrozen)}
function applyFrozen(){let left=0;columns.filter(c=>c.visible).forEach(c=>{if(!c.frozen)return;document.querySelectorAll(`[data-key="${c.key}"]`).forEach(el=>el.style.left=left+'px');const th=document.querySelector(`th[data-key="${c.key}"]`);left+=th?th.offsetWidth:0})}
function renderColumnModal(){$('columnList').innerHTML=columns.map((c,i)=>`<div class="column-row" draggable="true" data-index="${i}"><span class="drag">☷</span><b>${gridLabels[c.key]}</b><label><input type="checkbox" data-visible ${c.visible?'checked':''}> 보이기</label><span class="align-options">${['left','center','right'].map(a=>`<label><input type="radio" name="agency-align-${i}" value="${a}" ${c.align===a?'checked':''}> ${a==='left'?'좌':a==='center'?'가운데':'우'}</label>`).join('')}</span><label><input type="checkbox" data-frozen ${c.frozen?'checked':''}> 틀고정</label></div>`).join('');let dragged;document.querySelectorAll('.column-row').forEach(row=>{row.ondragstart=()=>{dragged=row;row.classList.add('dragging')};row.ondragend=()=>row.classList.remove('dragging');row.ondragover=e=>{e.preventDefault();if(dragged&&dragged!==row){const b=row.getBoundingClientRect();row.parentNode.insertBefore(dragged,e.clientY>b.top+b.height/2?row.nextSibling:row)}}})}
async function api(u,o){const r=await fetch(u,o);if(r.status===401){location.href='/supervisor';throw Error('관리자 로그인이 필요합니다.')}const type=r.headers.get('content-type')||'';if(!type.includes('application/json'))throw Error('서버가 올바른 API 응답을 반환하지 않았습니다. 서버를 재시작해 주세요.');const d=await r.json();if(!r.ok)throw Error(d.error||'요청 오류');return d}function openModal(id){$(id).classList.add('open');document.body.style.overflow='hidden'}function closeModal(x){x.classList.remove('open');document.body.style.overflow=document.querySelector('.overlay.open')?'hidden':''}
const digits=(v,max)=>String(v||'').replace(/\D/g,'').slice(0,max);
function formatPhone(v){const d=digits(v,11);if(d.startsWith('02')){if(d.length===10)return `02-${d.slice(2,6)}-${d.slice(6)}`;return d}if(d.length===10)return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;if(d.length===11)return `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;return d}
function formatMobile(v){const d=digits(v,11);return d.length===11?`${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`:d}
function showError(input,message){input.setCustomValidity(message);input.classList.toggle('invalid',!!message);const error=input.closest('.edit-field').querySelector('.validation-error');if(error){error.textContent=message;error.classList.toggle('visible',!!message)}}
function configureDetailValidation(){
  const phone=document.querySelector('[name=contact_phone]');if(phone){phone.inputMode='numeric';phone.oninput=()=>{phone.value=digits(phone.value,11);showError(phone,'')};phone.onblur=()=>{phone.value=formatPhone(phone.value);showError(phone,phone.value&&!/^(02-\d{4}-\d{4}|\d{3}-\d{3}-\d{4}|\d{3}-\d{4}-\d{4})$/.test(phone.value)?'대표전화 형식을 확인하세요.':'')}}
  const mobile=document.querySelector('[name=contact_mobile]');if(mobile){mobile.inputMode='numeric';mobile.oninput=()=>{mobile.value=digits(mobile.value,11);showError(mobile,mobile.value.length>=3&&!mobile.value.startsWith('010')?'담당자 모바일폰은 010으로 시작해야 합니다.':'')};mobile.onblur=()=>{mobile.value=formatMobile(mobile.value);showError(mobile,mobile.value&&!/^010-\d{4}-\d{4}$/.test(mobile.value)?'담당자 모바일폰은 010-####-#### 형식으로 입력하세요.':'')}}
  const account=document.querySelector('[name=bank_account]');if(account){account.inputMode='numeric';account.oninput=()=>{const raw=account.value,clean=digits(raw,30);account.value=clean;showError(account,raw!==clean?'계좌번호는 숫자만 입력할 수 있습니다.':'')}}
}
function addressSearch(){if(!window.daum?.Postcode)return MxAlert.error('카카오 주소검색을 불러오지 못했습니다.',{title:'주소검색 오류'});new daum.Postcode({oncomplete:d=>{document.querySelector('[name=postal_code]').value=d.zonecode;document.querySelector('[name=address1]').value=d.roadAddress||d.jibunAddress;document.querySelector('[name=address2]')?.focus()}}).open()}
const banks=['KB국민은행','신한은행','우리은행','하나은행','NH농협은행','IBK기업은행','SC제일은행','한국씨티은행','카카오뱅크','케이뱅크','토스뱅크','부산은행','대구은행','광주은행','전북은행','경남은행','제주은행','수협은행','새마을금고','신협','우체국'];
function openBankPicker(){$('bankList').innerHTML=banks.map(bank=>`<button type="button" class="btn" data-bank="${bank}">${bank}</button>`).join('');$('bankList').querySelectorAll('[data-bank]').forEach(button=>button.onclick=()=>{document.querySelector('[name=bank_name]').value=button.dataset.bank;closeModal($('bankOverlay'))});openModal('bankOverlay')}
async function setup(){const d=await api('/api/admin/agency-form-config');$('dynamicFilters').innerHTML=d.data.filter(f=>f.searchable&&!['company_name'].includes(f.field_key)).map(f=>`<div class="field"><label>${labels[f.field_key]}</label><input data-search="${f.field_key}" placeholder="${labels[f.field_key]} 검색"></div>`).join('')}
async function load(){const q=new URLSearchParams({company_name:$('company').value,status:$('status').value,size:'100'});document.querySelectorAll('[data-search]').forEach(x=>{if(x.value)q.set(x.dataset.search,x.value)});gridRows=(await api('/api/admin/advertisers?'+q)).data;renderGrid()}
async function openAgencyHospitals(id){const agency=gridRows.find(row=>Number(row.id)===Number(id));$('hospitalsCaption').textContent=agency?`${agency.company_name}에서 관리하는 승인된 병원 목록`:'';$('hospitalRows').innerHTML='<tr><td colspan="7" style="text-align:center;padding:28px">병원 현황을 불러오는 중입니다...</td></tr>';$('hospitalEmpty').style.display='none';openModal('hospitalsOverlay');try{const rows=(await api('/api/admin/agencies/'+id+'/hospitals')).data;$('hospitalRows').innerHTML=rows.map(row=>`<tr><td><b>${esc(row.company_name)}</b></td><td>${esc(row.business_no||'-')}</td><td>${esc(row.serial_no||'-')}</td><td>${esc(row.medical_subjects||'-')}</td><td>${esc(row.representative_phone||'-')}</td><td><span class="badge ${row.status}">${statusLabel[row.status]||esc(row.status)}</span></td><td>${String(row.linked_at||'').slice(0,10)||'-'}</td></tr>`).join('');$('hospitalEmpty').style.display=rows.length?'none':'block'}catch(error){$('hospitalRows').innerHTML=`<tr><td colspan="7" style="text-align:center;padding:28px;color:#dc2626">${esc(error.message)}</td></tr>`}}
async function openAgency(id){const a=(await api('/api/admin/agencies/'+id)).data;$('id').value=id;$('fields').innerHTML=keys.map(k=>{const span=['address1','address2'].includes(k)?'span2':'',readonly=['postal_code','bank_name'].includes(k)?'readonly':'',button=k==='address1'?'<button type="button" class="btn" onclick="addressSearch()">카카오 주소검색</button>':k==='bank_name'?'<button type="button" class="btn" onclick="openBankPicker()">은행 찾기</button>':'';return `<div class="edit-field ${span}"><label>${labels[k]}</label><div class="input-row"><input name="${k}" value="${esc(a[k]||'')}" ${readonly}>${button}</div>${['contact_phone','contact_mobile','bank_account'].includes(k)?'<small class="validation-error"></small>':''}</div>`}).join('')+`<div class="consent-edit"><label><input type="checkbox" name="terms_consent" value="1" ${a.terms_consent?'checked':''}> 이용약관동의</label><label><input type="checkbox" name="privacy_consent" value="1" ${a.privacy_consent?'checked':''}> 개인정보수집이용동의</label><label><input type="checkbox" name="push_consent" value="1" ${a.push_consent?'checked':''}> 알림수신동의</label><label><input type="checkbox" name="email_consent" value="1" ${a.email_consent?'checked':''}> 이메일수신동의</label></div><div class="edit-field span2"><label>새 비밀번호</label><input type="password" name="new_password" autocomplete="new-password" placeholder="변경할 때만 입력"><div class="password-note">기존 비밀번호는 보안상 표시하지 않습니다. 대문자·소문자·숫자·특수문자를 포함한 8자 이상으로 입력하세요.</div></div>`;configureDetailValidation();openModal('detailOverlay')}
async function changeStatus(s){let reason='';if(s==='rejected'){reason=(await MxAlert.prompt('반려 사유를 입력하세요.',{title:'대행사 반려',multiline:true,confirmText:'반려'} )||'').trim();if(!reason)return}else{const ok=await MxAlert.confirm('이 대행사를 승인하시겠습니까?',{title:'대행사 승인',type:'success',confirmText:'승인',confirmColor:'black'});if(!ok)return}await api('/api/admin/advertisers/'+$('id').value+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s,reason})});closeModal($('detailOverlay'));load()}
$('form').onsubmit=async e=>{e.preventDefault();await api('/api/admin/agencies/'+$('id').value,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal($('detailOverlay'));load()};$('approveBtn').onclick=()=>changeStatus('approved');$('rejectBtn').onclick=()=>changeStatus('rejected');$('searchBtn').onclick=load;$('registerBtn').onclick=()=>{ $('registerFrame').src='/agency-register?embed=1&v='+Date.now();openModal('registerOverlay')};$('submitRegister').onclick=()=> $('registerFrame').contentWindow.postMessage({type:'submit-agency-registration'},location.origin);$('columnBtn').onclick=()=>{renderColumnModal();openModal('columnOverlay')};$('columnSaveBtn').onclick=()=>{const next=[];document.querySelectorAll('.column-row').forEach(row=>{const old=columns[Number(row.dataset.index)],visible=row.querySelector('[data-visible]').checked;next.push({...old,visible,align:row.querySelector('input[type=radio]:checked')?.value||'left',frozen:visible&&row.querySelector('[data-frozen]').checked})});columns=next;localStorage.setItem('agencyGridColumns',JSON.stringify(columns));renderGrid();closeModal($('columnOverlay'))};$('columnResetBtn').onclick=()=>{columns=defaultColumns();localStorage.removeItem('agencyGridColumns');renderColumnModal()};document.querySelectorAll('.close').forEach(b=>b.onclick=()=>closeModal(b.closest('.overlay')));$('logoutBtn').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.href='/supervisor'};window.onmessage=e=>{if(e.origin===location.origin&&e.data?.type==='agency-registered')load()};window.addEventListener('resize',applyFrozen);loadColumns();setup().then(load).catch(e=>MxAlert.error(e.message,{title:'조회 실패'}));
</script></body></html>
