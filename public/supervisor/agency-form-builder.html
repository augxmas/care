<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>전문 외국환자관리 CRM</title><link rel="stylesheet" href="/css/common.css"><script src="/js/alert.js"></script>
<style>
body{margin:0;background:#f4f4f5;color:#18181b;font-family:Arial,sans-serif}.top{height:62px;background:#050505;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4%}.top a{color:#fff;text-decoration:none}.layout{width:94%;margin:24px auto;display:grid;grid-template-columns:minmax(520px,1fr) minmax(380px,.8fr);gap:20px}.card{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:22px}.head,.actions{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{font-size:12px;color:#71717a}.field-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}.field-row{display:grid;grid-template-columns:minmax(150px,1fr) 105px 105px 105px;gap:10px;align-items:center;padding:12px;border:1px solid #e4e4e7;border-radius:9px}.switch{display:flex;align-items:center;gap:6px;font-size:12px}.btn{border:1px solid #d4d4d8;border-radius:8px;padding:10px 15px;background:#fff;color:#18181b;cursor:pointer;text-decoration:none}.black{background:#111;color:#fff}.preview{position:sticky;top:20px}.preview-box{border:1px solid #d4d4d8;border-radius:12px;padding:20px;background:#fafafa;margin-top:15px}.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.preview-field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.preview-field input{width:100%;box-sizing:border-box;padding:9px}.span2{grid-column:span 2}.required{color:#dc2626}.result{display:none;margin-top:14px;padding:13px;background:#dcfce7;color:#166534}@media(max-width:950px){.layout{grid-template-columns:1fr}.preview{position:static}}
</style></head><body>
<header class="top"><a href="/supervisor/agencies">← 대행사관리</a><strong>대행사 등록폼 설정</strong><button class="btn" id="logoutBtn">로그아웃</button></header>
<main class="layout"><section class="card"><h1>등록폼 항목 설정</h1><p class="muted">등록폼 포함 여부, 필수 입력 여부와 조회조건 사용 여부를 설정합니다.</p>
<div class="field-row" style="font-weight:700;background:#fafafa"><span>관리항목</span><span>폼에 포함</span><span>필수 입력</span><span>조회조건</span></div><div id="fieldList" class="field-list"></div>
<div class="actions" style="justify-content:flex-end;margin-top:20px"><a class="btn" href="/agency-register" target="_blank">등록폼 보기</a><button class="btn black" id="saveBtn">설정 저장</button></div><div class="result" id="result">대행사 등록폼 설정을 저장했습니다.</div></section>
<aside class="card preview"><h2>실시간 미리보기</h2><div class="preview-box"><h2 style="text-align:center">대행사 등록 신청</h2><div id="preview" class="preview-grid"></div></div></aside></main>
<script>
const $=id=>document.getElementById(id),labels={company_name:'대행사명',company_name_en:'대행사명(en)',ceo_name:'대표자',business_no:'사업자등록번호',biz_cert:'사업자등록증',contact_phone:'대표전화',address1:'주소1',address2:'주소2',postal_code:'우편번호',contact_name:'담당자명',contact_mobile:'담당자 모바일폰',contact_email:'담당자 이메일',bank_name:'은행',bank_account:'계좌번호'},core=new Set(['company_name','business_no','contact_email']);let fields=[];
async function api(u,o){const r=await fetch(u,o);if(r.status===401){location.href='/supervisor';throw Error('관리자 로그인이 필요합니다.')}const type=r.headers.get('content-type')||'';if(!type.includes('application/json'))throw Error('서버가 올바른 API 응답을 반환하지 않았습니다. 서버를 재시작해 주세요.');const d=await r.json();if(!r.ok)throw Error(d.error||'요청 오류');return d}
function render(){ $('fieldList').innerHTML=fields.map(f=>`<div class="field-row" data-key="${f.field_key}"><b>${labels[f.field_key]}</b><label class="switch"><input type="checkbox" data-role="enabled" ${f.enabled?'checked':''} ${core.has(f.field_key)?'disabled':''}> 포함</label><label class="switch"><input type="checkbox" data-role="required" ${f.required?'checked':''} ${core.has(f.field_key)?'disabled':''}> 필수</label><label class="switch"><input type="checkbox" data-role="searchable" ${f.searchable?'checked':''}> 사용</label></div>`).join('');document.querySelectorAll('.field-row input').forEach(x=>x.onchange=e=>{const f=fields.find(v=>v.field_key===e.target.closest('.field-row').dataset.key);f[e.target.dataset.role]=e.target.checked;if(!f.enabled)f.required=false;render()});$('preview').innerHTML=fields.filter(f=>f.enabled).map(f=>`<div class="preview-field ${['address1','address2','biz_cert'].includes(f.field_key)?'span2':''}"><label>${labels[f.field_key]} ${f.required?'<span class="required">*</span>':'(선택)'}</label><input disabled></div>`).join('')}
async function init(){const d=await api('/api/admin/agency-form-config');fields=d.data.map(f=>({...f,enabled:!!f.enabled,required:!!f.required,searchable:!!f.searchable}));render()}
$('saveBtn').onclick=async()=>{await api('/api/admin/agency-form-config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields})});$('result').style.display='block';init()};$('logoutBtn').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.href='/supervisor'};init().catch(e=>MxAlert.error(e.message,{title:'조회 실패'}));
</script></body></html>
