<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="55%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="200" fill="url(#bg)"/>
  <circle cx="980" cy="50"  r="70" fill="#bfdbfe" opacity="0.55"/>
  <circle cx="1060" cy="150" r="46" fill="#93c5fd" opacity="0.45"/>
  <circle cx="90"   cy="160" r="58" fill="#dbeafe" opacity="0.60"/>
  <circle cx="870"  cy="140" r="22" fill="#93c5fd" opacity="0.35"/>

  <g transform="translate(60,55)">
    <path d="M45 95 C 45 75 22 60  8 78  C -8 100 12 130 45 145 C 78 130 98 100 82 78  C 68 60 45 75 45 95 Z"
