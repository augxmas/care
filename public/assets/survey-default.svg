  <text x="180" y="92"  font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"
        font-size="34" font-weight="800" fill="#1e3a8a" letter-spacing="-1">사전 문진</text>
  <text x="180" y="125" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"
