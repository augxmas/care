<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>공지사항 | MODS CLINIC</title><link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
  <style>*{box-sizing:border-box}body{margin:0;background:#f7f5f0;color:#20211f;font-family:'Noto Sans KR','Noto Sans Thai',sans-serif}.head{background:#232824;color:#fff;padding:28px 24px}.head-inner,.main{width:min(980px,calc(100% - 36px));margin:auto}.brand{font-family:'DM Serif Display',serif;font-size:25px;letter-spacing:.08em;color:#fff;text-decoration:none}.hero{padding:72px 0 42px}.hero small{color:#687366;letter-spacing:.18em;font-weight:700}.hero h1{font-family:'DM Serif Display','Noto Sans KR','Noto Sans Thai',serif;font-size:46px;font-weight:400;margin:12px 0}.hero p{color:#6b6f69}.list{border-top:2px solid #596554;margin-bottom:90px}.item{display:grid;grid-template-columns:72px 1fr 110px;gap:18px;align-items:center;padding:22px 12px;border-bottom:1px solid #deddd6;cursor:pointer}.item:hover{background:#fff}.pin{color:#9b675d;font-size:12px;font-weight:700}.title{font-size:16px;font-weight:600}.date{text-align:right;color:#92958f;font-size:12px}.empty{text-align:center;padding:65px;color:#999}.back{display:inline-block;color:#dfe4dc;text-decoration:none;font-size:12px;margin-left:25px}@media(max-width:600px){.item{grid-template-columns:48px 1fr}.date{grid-column:2;text-align:left}.hero h1{font-size:37px}}</style>
</head>
<body><header class="head"><div class="head-inner"><a class="brand" href="/">MODS CLINIC</a><a class="back" href="/" id="backLink">← 홈으로</a></div></header><main class="main"><section class="hero"><small>MODS CLINIC · NEWS</small><h1 id="pageTitle">공지사항</h1><p id="pageDesc">모즈클리닉의 새로운 소식과 이벤트를 확인하세요.</p></section><section class="list" id="noticeList"><div class="empty">불러오는 중입니다.</div></section></main>
<script>
const langs=(navigator.languages?.length?navigator.languages:[navigator.language||'en']).map(v=>String(v).toLowerCase().split('-')[0]).join(',');const primary=String(navigator.language||'ko').toLowerCase().split('-')[0];const UI={th:{title:'ประกาศ',desc:'ติดตามข่าวสารและกิจกรรมล่าสุดจาก MODS CLINIC',back:'← กลับหน้าหลัก',empty:'ยังไม่มีประกาศ'},en:{title:'Notices',desc:'See the latest news and events from MODS CLINIC.',back:'← Home',empty:'No notices yet.'},ko:{title:'공지사항',desc:'모즈클리닉의 새로운 소식과 이벤트를 확인하세요.',back:'← 홈으로',empty:'등록된 공지가 없습니다.'}};const ui=UI[primary]||UI.en;document.documentElement.lang=primary;document.getElementById('pageTitle').textContent=ui.title;document.getElementById('pageDesc').textContent=ui.desc;document.getElementById('backLink').textContent=ui.back;(async()=>{try{const r=await fetch(`/api/notices/public-list/all?advertiser_id=3&lang=${encodeURIComponent(langs)}`),d=await r.json();if(!r.ok||!d.ok)throw Error();document.getElementById('noticeList').innerHTML=d.data.length?d.data.map(n=>`<article class="item" onclick="window.open('/notice/${n.id}','mods_notice_${n.id}','popup=yes,width=820,height=820,resizable=yes,scrollbars=yes')"><div class="pin">${Number(n.is_pinned)?'PIN':'NEWS'}</div><div class="title"></div><div class="date">${String(n.created_at||'').slice(0,10)}</div></article>`).join(''):`<div class="empty">${ui.empty}</div>`;document.querySelectorAll('.item .title').forEach((el,i)=>el.textContent=d.data[i].title)}catch{document.getElementById('noticeList').innerHTML=`<div class="empty">${ui.empty}</div>`}})();
</script></body></html>
