<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign Form</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/common.css">
  <style>
    body { background:#f5f7fb; min-height:100vh; overflow:hidden; }
    .form-shell { width:min(92vw, 560px); height:calc(100vh - 84px); margin:42px auto; display:flex; }
    .form-panel { background:#fff; border:1px solid var(--gray-200); border-radius:8px; box-shadow:0 2px 10px rgba(15,23,42,.08); overflow:hidden; display:flex; flex-direction:column; width:100%; min-height:0; }
    .form-head { padding:22px 24px; border-bottom:1px solid #1d4ed8; background:#2563eb; text-align:center; flex:0 0 auto; }
    .form-head h1 { margin:0; font-size:22px; color:#fff; letter-spacing:0; }
    .form-head p { margin:8px 0 0; color:#dbeafe; font-size:14px; line-height:1.55; }
    #collectForm { display:flex; flex-direction:column; min-height:0; flex:1; }
    .form-body { padding:22px 24px; overflow-y:auto; min-height:0; flex:1; }
    .preview-bar { margin-bottom:14px; padding:10px 12px; border:1px solid #bfdbfe; background:#eff6ff; color:#1d4ed8; border-radius:6px; font-size:13px; font-weight:700; }
    .preview-hidden { margin-bottom:16px; padding:12px; border:1px dashed #93c5fd; border-radius:8px; background:#eff6ff; }
    .preview-hidden-title { margin-bottom:8px; font-size:12px; font-weight:800; color:#1d4ed8; }
    .preview-hidden-list { display:grid; gap:8px; }
    .preview-hidden-item { display:grid; grid-template-columns:120px 1fr; gap:8px; align-items:center; font-size:12px; }
    .preview-hidden-key { min-width:0; color:#1e40af; font-weight:800; }
    .preview-hidden-key span { font-weight:500; color:#60a5fa; }
    .preview-hidden-value { min-width:0; padding:7px 9px; border:1px solid #bfdbfe; border-radius:6px; background:#fff; color:var(--gray-700); word-break:break-word; }
    .empty-state { padding:28px; text-align:center; color:var(--gray-500); }
    .submit-row { display:flex; justify-content:center; gap:8px; padding:14px 24px 24px; border-top:1px solid var(--gray-100); background:#fff; flex:0 0 auto; }
    .field-error { display:none; margin-top:5px; color:var(--danger); font-size:12px; font-weight:600; }
    .form-control.is-invalid { border-color:var(--danger); background:#fff5f5; }
    @media (max-width: 640px) {
      body { overflow:auto; }
      .form-shell { height:calc(100vh - 36px); margin:18px auto; }
      .form-head, .form-body { padding:18px; }
      .submit-row { padding:0 18px 18px; }
      .preview-hidden-item { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <main class="form-shell">
    <section class="form-panel">
      <div class="form-head">
        <h1 id="title">Campaign Form</h1>
        <p id="description"></p>
      </div>
      <form id="collectForm">
        <div class="form-body" id="fieldHost">
          <div class="empty-state">Loading form...</div>
        </div>
        <div class="submit-row">
          <button class="btn btn-primary" id="submitBtn" type="submit">Submit</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/js/alert.js"></script>
  <script>

    const previewMode = new URLSearchParams(location.search).get('preview') === '1';
    const fieldHost = document.getElementById('fieldHost');
    const form = document.getElementById('collectForm');
    const submitBtn = document.getElementById('submitBtn');
    const SUPPORTED_LANGUAGES = ['ko', 'th', 'vi', 'ar', 'en', 'zh', 'ja'];
    let locale = 'en';
    const UI = {

      th: { loading:'กำลังโหลดแบบฟอร์ม', formTitle:'แบบฟอร์มแคมเปญ', submit:'ส่ง', submitting:'กำลังส่ง...', preview:'ดูตัวอย่าง', previewBar:'โหมดดูตัวอย่าง ไม่สามารถส่งข้อมูลจริงได้', empty:'ไม่มีช่องข้อมูลที่จะแสดง', selectChannel:'เลือกช่องทาง', selectNationality:'เลือกสัญชาติ', selectGender:'เลือกเพศ', male:'ชาย', female:'หญิง', required:'กรุณากรอกข้อมูลในช่องนี้', loadError:'ไม่สามารถโหลดแบบฟอร์มได้', submitError:'ส่งข้อมูลไม่สำเร็จ', serverError:'เกิดข้อผิดพลาดของเซิร์ฟเวอร์', complete:'ส่งข้อมูลเรียบร้อย', success:'ส่งข้อมูลเรียบร้อยแล้ว' },
      vi: { loading:'Đang tải biểu mẫu', formTitle:'Biểu mẫu chiến dịch', submit:'Gửi', submitting:'Đang gửi...', preview:'Xem trước', previewBar:'Đây là chế độ xem trước. Chức năng gửi đã bị vô hiệu hóa.', empty:'Không có trường nhập liệu để hiển thị.', selectChannel:'Chọn kênh', selectNationality:'Chọn quốc tịch', selectGender:'Chọn giới tính', male:'Nam', female:'Nữ', required:'Vui lòng nhập trường này.', loadError:'Không thể tải biểu mẫu.', submitError:'Không thể gửi dữ liệu.', serverError:'Đã xảy ra lỗi máy chủ.', complete:'Hoàn tất gửi', success:'Đã gửi thành công.' },
      ar: { loading:'جارٍ تحميل النموذج', formTitle:'نموذج الحملة', submit:'إرسال', submitting:'جارٍ الإرسال...', preview:'معاينة', previewBar:'هذا وضع المعاينة. تم تعطيل الإرسال الفعلي.', empty:'لا توجد حقول إدخال لعرضها.', selectChannel:'اختر القناة', selectNationality:'اختر الجنسية', selectGender:'اختر الجنس', male:'ذكر', female:'أنثى', required:'يرجى تعبئة هذا الحقل.', loadError:'تعذر تحميل النموذج.', submitError:'تعذر إرسال البيانات.', serverError:'حدث خطأ في الخادم.', complete:'اكتمل الإرسال', success:'تم الإرسال بنجاح.' },
      en: { loading:'Loading form...', formTitle:'Campaign Form', submit:'Submit', submitting:'Submitting...', preview:'Preview', previewBar:'Preview mode. Actual submission is disabled.', empty:'There are no fields to display.', selectChannel:'Select a channel', selectNationality:'Select a nationality', selectGender:'Select gender', male:'Male', female:'Female', required:'Please complete this field.', loadError:'Unable to load the form.', submitError:'Submission failed.', serverError:'A server error occurred.', complete:'Submission complete', success:'Submitted successfully.' },
      zh: { loading:'正在加载表单', formTitle:'活动表单', submit:'提交', submitting:'正在提交...', preview:'预览', previewBar:'当前为预览模式，无法实际提交。', empty:'没有可显示的输入项目。', selectChannel:'请选择渠道', selectNationality:'请选择国籍', selectGender:'请选择性别', male:'男', female:'女', required:'请填写此项。', loadError:'无法加载表单。', submitError:'提交失败。', serverError:'服务器发生错误。', complete:'提交完成', success:'提交成功。' },
      ja: { loading:'フォームを読み込んでいます', formTitle:'キャンペーンフォーム', submit:'送信', submitting:'送信中...', preview:'プレビュー', previewBar:'プレビューモードです。実際の送信は無効です。', empty:'表示する入力項目がありません。', selectChannel:'チャネルを選択してください', selectNationality:'国籍を選択してください', selectGender:'性別を選択してください', male:'男性', female:'女性', required:'この項目を入力してください。', loadError:'フォームを読み込めませんでした。', submitError:'送信できませんでした。', serverError:'サーバーエラーが発生しました。', complete:'送信完了', success:'送信しました。' },
    };
    const FIELD_LABELS = {
      ko: { user_id:'ID',hospital_patient_id:'병원ID(환자일련번호)',nationality:'국적',channel:'채널',name:'이름',pronunciation_ko:'이름(한국어 발음)',nickname:'닉네임',gender:'성별',birth_ym:'생년월',birth_ymd:'생년월일',referrer_name:'추천인 이름',referrer_email:'추천인 이메일',mobile:'모바일폰',phone:'전화',email:'이메일',address:'주소',job:'직업',company:'소속',postal_code:'우편번호',sns:'SNS',payment_method:'결제수단',payment_amount:'결제금액' },
      th: { user_id:'รหัสผู้ใช้',hospital_patient_id:'รหัสผู้ป่วยของโรงพยาบาล',nationality:'สัญชาติ',channel:'ช่องทาง',name:'ชื่อ',pronunciation_ko:'การออกเสียงชื่อเป็นภาษาเกาหลี',nickname:'ชื่อเล่น',gender:'เพศ',birth_ym:'เดือนและปีเกิด',birth_ymd:'วันเดือนปีเกิด',referrer_name:'ชื่อผู้แนะนำ',referrer_email:'อีเมลผู้แนะนำ',mobile:'โทรศัพท์มือถือ',phone:'โทรศัพท์',email:'อีเมล',address:'ที่อยู่',job:'อาชีพ',company:'บริษัท/สังกัด',postal_code:'รหัสไปรษณีย์',sns:'SNS',payment_method:'วิธีชำระเงิน',payment_amount:'จำนวนเงินที่ชำระ' },
      vi: { user_id:'ID người dùng',hospital_patient_id:'Mã bệnh nhân',nationality:'Quốc tịch',channel:'Kênh',name:'Họ tên',pronunciation_ko:'Cách đọc tên bằng tiếng Hàn',nickname:'Biệt danh',gender:'Giới tính',birth_ym:'Tháng năm sinh',birth_ymd:'Ngày sinh',referrer_name:'Tên người giới thiệu',referrer_email:'Email người giới thiệu',mobile:'Điện thoại di động',phone:'Điện thoại',email:'Email',address:'Địa chỉ',job:'Nghề nghiệp',company:'Công ty/Đơn vị',postal_code:'Mã bưu chính',sns:'SNS',payment_method:'Phương thức thanh toán',payment_amount:'Số tiền thanh toán' },
      ar: { user_id:'معرّف المستخدم',hospital_patient_id:'رقم المريض بالمستشفى',nationality:'الجنسية',channel:'القناة',name:'الاسم',pronunciation_ko:'نطق الاسم بالكورية',nickname:'الاسم المستعار',gender:'الجنس',birth_ym:'شهر وسنة الميلاد',birth_ymd:'تاريخ الميلاد',referrer_name:'اسم المُحيل',referrer_email:'بريد المُحيل',mobile:'الهاتف المحمول',phone:'الهاتف',email:'البريد الإلكتروني',address:'العنوان',job:'المهنة',company:'الشركة/الجهة',postal_code:'الرمز البريدي',sns:'حساب التواصل الاجتماعي',payment_method:'طريقة الدفع',payment_amount:'مبلغ الدفع' },
      en: { user_id:'User ID',hospital_patient_id:'Hospital patient ID',nationality:'Nationality',channel:'Channel',name:'Name',pronunciation_ko:'Name pronunciation in Korean',nickname:'Nickname',gender:'Gender',birth_ym:'Birth month and year',birth_ymd:'Date of birth',referrer_name:'Referrer name',referrer_email:'Referrer email',mobile:'Mobile phone',phone:'Phone',email:'Email',address:'Address',job:'Occupation',company:'Company/Affiliation',postal_code:'Postal code',sns:'Social media',payment_method:'Payment method',payment_amount:'Payment amount' },
      zh: { user_id:'用户ID',hospital_patient_id:'医院患者编号',nationality:'国籍',channel:'渠道',name:'姓名',pronunciation_ko:'姓名的韩语发音',nickname:'昵称',gender:'性别',birth_ym:'出生年月',birth_ymd:'出生日期',referrer_name:'推荐人姓名',referrer_email:'推荐人邮箱',mobile:'手机号码',phone:'电话号码',email:'电子邮箱',address:'地址',job:'职业',company:'公司/所属机构',postal_code:'邮政编码',sns:'社交媒体',payment_method:'付款方式',payment_amount:'付款金额' },
      ja: { user_id:'ユーザーID',hospital_patient_id:'病院患者ID',nationality:'国籍',channel:'チャネル',name:'氏名',pronunciation_ko:'氏名の韓国語読み',nickname:'ニックネーム',gender:'性別',birth_ym:'生年月',birth_ymd:'生年月日',referrer_name:'紹介者名',referrer_email:'紹介者メール',mobile:'携帯電話',phone:'電話番号',email:'メール',address:'住所',job:'職業',company:'会社・所属',postal_code:'郵便番号',sns:'SNS',payment_method:'支払方法',payment_amount:'支払金額' },
    };
    const NATIONALITY_LABELS = {
      ko: ['일본','중국','베트남','태국','북미','중동','기타'],
      th: ['ญี่ปุ่น','จีน','เวียดนาม','ไทย','อเมริกาเหนือ','ตะวันออกกลาง','อื่น ๆ'],
      vi: ['Nhật Bản','Trung Quốc','Việt Nam','Thái Lan','Bắc Mỹ','Trung Đông','Khác'],
      ar: ['اليابان','الصين','فيتنام','تايلاند','أمريكا الشمالية','الشرق الأوسط','أخرى'],
      en: ['Japan','China','Vietnam','Thailand','North America','Middle East','Other'],
      zh: ['日本','中国','越南','泰国','北美','中东','其他'],
      ja: ['日本','中国','ベトナム','タイ','北米','中東','その他'],
    };
    function t(key) { return (UI[locale] || UI.en)[key] || UI.en[key] || key; }
    function chooseLocale(enabled) {
      const allowed = new Set((enabled || []).filter((v) => SUPPORTED_LANGUAGES.includes(v)));
      const requested = new URLSearchParams(location.search).get('lang')?.toLowerCase().split('-')[0];
      if (requested && allowed.has(requested)) return requested;
      const browser = (navigator.languages?.length ? navigator.languages : [navigator.language || 'en'])
        .map((v) => String(v).toLowerCase().split('-')[0]);
      return browser.find((v) => allowed.has(v)) || 'en';
    }
    function applyLocale() {
      document.documentElement.lang = locale;
      document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
      document.title = t('formTitle');
      submitBtn.textContent = previewMode ? t('preview') : t('submit');
    }

    function esc(v) {
      return String(v || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    function inputType(key) {
      if (key === 'email' || key === 'referrer_email') return 'email';
      if (key === 'birth_ym' || key === 'birth_ymd' || key === 'mobile' || key === 'phone' || key === 'postal_code' || key === 'payment_amount') return 'text';
      return 'text';
    }

    const CHANNELS = [
      { key: 'facebook', label: 'Facebook' },
      { key: 'x', label: 'X' },
      { key: 'line', label: 'LINE' },
      { key: 'instagram', label: 'Instagram' },
    ];
    function channelLabel(key) {
      return (CHANNELS.find((ch) => ch.key === key) || {}).label || key;
    }
    function channelOptions(csv) {
      const allowed = new Set(CHANNELS.map((ch) => ch.key));
      return String(csv || '')
        .split(',')
        .map((s) => s.trim().toLowerCase())
        .filter((s, idx, arr) => allowed.has(s) && arr.indexOf(s) === idx);
    }
    function fieldValuePreview(f) {
      if (f.key !== 'channel') return f.defaultValue || '(기본값 없음)';
      const labels = channelOptions(f.defaultValue).map(channelLabel);
      return labels.length ? labels.join(', ') : '(기본값 없음)';
    }

    const NATIONALITIES = ['일본', '중국', '베트남', '태국', '북미', '중동', '기타'];
    const FIELD_RULES = {
      birth_ymd: {
        digits: true,
        max: 8,
        message: '생년월일은 yyyymmdd 형식의 숫자 8자리로 입력하세요.',
        format: (d) => d.length === 8 ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}` : d,
        normalize: (v) => digitsOnly(v).slice(0, 8),
        valid: (d) => /^\d{8}$/.test(d),
      },
      birth_ym: {
        digits: true,
        max: 6,
        message: '생년월은 yyyymm 형식의 숫자 6자리로 입력하세요.',
        format: (d) => d.length === 6 ? `${d.slice(0,4)}-${d.slice(4,6)}` : d,
        normalize: (v) => digitsOnly(v).slice(0, 6),
        valid: (d) => /^\d{6}$/.test(d),
      },
      mobile: {
        digits: true,
        max: 11,
        message: '모바일은 숫자 11자리로 입력하세요.',
        format: formatPhone11,
        normalize: (v) => digitsOnly(v).slice(0, 11),
        valid: (d) => /^\d{11}$/.test(d),
      },
      phone: {
        digits: true,
        max: 11,
        message: '전화는 숫자 10~11자리로 입력하세요. 02로 시작하는 서울 번호는 10자리도 가능합니다.',
        format: formatPhone,
        normalize: (v) => digitsOnly(v).slice(0, 11),
        valid: (d) => /^02\d{8}$/.test(d) || /^\d{11}$/.test(d),
      },
      postal_code: {
        digits: true,
        max: 10,
        message: '우편번호는 숫자만 입력하세요.',
        normalize: (v) => digitsOnly(v).slice(0, 10),
        valid: (d) => /^\d*$/.test(d),
      },
      email: {
        message: '이메일 양식을 확인하세요.',
        normalize: (v) => String(v || '').trim(),
        valid: (v) => !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),
      },
      referrer_email: {
        message: '추천인 이메일 양식을 확인하세요.',
        normalize: (v) => String(v || '').trim(),
        valid: (v) => !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),
      },
    };

    function digitsOnly(v) {
      return String(v || '').replace(/\D/g, '');
    }
    function formatPhone11(d) {
      return d.length === 11 ? `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7,11)}` : d;
    }
    function formatPhone(d) {
      if (/^02\d{8}$/.test(d)) return `${d.slice(0,2)}-${d.slice(2,6)}-${d.slice(6,10)}`;
      return formatPhone11(d);
    }
    function setFieldError(el, msg) {
      const err = document.getElementById(`${el.id}_err`);
      el.classList.toggle('is-invalid', !!msg);
      if (err) {
        err.textContent = msg || '';
        err.style.display = msg ? 'block' : 'none';
      }
    }
    function validateField(el, notify = true) {
      const key = el.dataset.key;
      if (!key) return true;
      const required = el.required;
      if (required && !String(el.value || '').trim()) {
        if (notify) setFieldError(el, `${el.dataset.label || ''} ${t('required')}`.trim());
        return false;
      }
      const rule = FIELD_RULES[key];
      if (rule) {
        const normalized = rule.normalize(el.value);
        if (rule.digits) el.value = normalized;
        if (normalized && !rule.valid(normalized)) {
          if (notify) setFieldError(el, rule.message);
          return false;
        }
        if (rule.format && normalized) el.value = rule.format(normalized);
      }
      if (notify) setFieldError(el, '');
      return true;
    }
    function bindFieldValidation() {
      fieldHost.querySelectorAll('[data-key]').forEach((el) => {
        const rule = FIELD_RULES[el.dataset.key];
        if (rule?.digits) {
          el.addEventListener('input', () => {
            el.value = digitsOnly(el.value).slice(0, rule.max || 99);
            setFieldError(el, '');
          });
          el.addEventListener('focus', () => { el.value = digitsOnly(el.value); });
        }
        el.addEventListener('blur', () => validateField(el, true));
        if (el.tagName === 'SELECT') el.addEventListener('change', () => validateField(el, true));
      });
    }

    function inputAttrs(key) {
      const attrs = {
        birth_ymd: 'inputmode="numeric" maxlength="8" autocomplete="off"',
        birth_ym: 'inputmode="numeric" maxlength="6" autocomplete="off"',
        mobile: 'inputmode="numeric" maxlength="11" autocomplete="tel"',
        phone: 'inputmode="numeric" maxlength="11" autocomplete="tel"',
        postal_code: 'inputmode="numeric" maxlength="10" autocomplete="postal-code"',
        email: 'autocomplete="email"',
        referrer_email: 'autocomplete="email"',
      };
      return attrs[key] || '';
    }
    function defaultPlaceholder(key, fallback) {
      if (fallback) return fallback;
      const map = {
        birth_ymd: 'yyyymmdd',
        birth_ym: 'yyyymm',
        mobile: '01012345678',
        phone: '01012345678',
        postal_code: '숫자만 입력',
        email: 'example@email.com',
        referrer_email: 'example@email.com',
      };
      return map[key] || '';
    }

    function renderFields(fields) {
      const visible = fields.filter((f) => !f.hidden);
      const hidden = fields.filter((f) => f.hidden);
      const parts = [];
      if (previewMode) parts.push(`<div class="preview-bar">${esc(t('previewBar'))}</div>`);
      hidden.forEach((f) => {
        parts.push(`<input type="hidden" name="${esc(f.key)}" value="${esc(f.defaultValue)}">`);
      });
      if (previewMode && hidden.length) {
        parts.push(`
          <div class="preview-hidden">
            <div class="preview-hidden-title">숨김 항목 미리보기 (${hidden.length}개)</div>
            <div class="preview-hidden-list">
              ${hidden.map((f) => `
                <div class="preview-hidden-item">
                  <div class="preview-hidden-key">${esc(f.label)} <span>(${esc(f.key)})</span></div>
                  <div class="preview-hidden-value">${esc(fieldValuePreview(f))}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `);
      }
      if (!visible.length) {
        parts.push(`<div class="empty-state">${esc(t('empty'))}</div>`);
      }
      visible.forEach((f) => {
        const required = f.required ? ' required' : '';
        const reqMark = f.required ? ' <span class="required">*</span>' : '';
        if (f.key === 'channel') {
          const options = channelOptions(f.defaultValue);
          parts.push(`
            <div class="form-group">
              <label class="form-label" for="cf_${esc(f.key)}">${esc(f.label)}${reqMark}</label>
              <select class="form-control" id="cf_${esc(f.key)}" name="${esc(f.key)}" data-key="${esc(f.key)}" data-label="${esc(f.label)}"${required}>
                <option value="">${esc(f.placeholder || t('selectChannel'))}</option>
                ${options.map((key) => `<option value="${esc(key)}">${esc(channelLabel(key))}</option>`).join('')}
              </select>
              <div class="field-error" id="cf_${esc(f.key)}_err"></div>
            </div>
          `);
          return;
        }
        if (f.key === 'nationality') {
          parts.push(`
            <div class="form-group">
              <label class="form-label" for="cf_${esc(f.key)}">${esc(f.label)}${reqMark}</label>
              <select class="form-control" id="cf_${esc(f.key)}" name="${esc(f.key)}" data-key="${esc(f.key)}" data-label="${esc(f.label)}"${required}>
                <option value="">${esc(f.placeholder || t('selectNationality'))}</option>
                ${NATIONALITIES.map((v, i) => `<option value="${esc(v)}">${esc((NATIONALITY_LABELS[locale] || NATIONALITY_LABELS.en)[i])}</option>`).join('')}
              </select>
              <div class="field-error" id="cf_${esc(f.key)}_err"></div>
            </div>
          `);
          return;
        }
        if (f.key === 'gender') {
          parts.push(`
            <div class="form-group">
              <label class="form-label" for="cf_${esc(f.key)}">${esc(f.label)}${reqMark}</label>
              <select class="form-control" id="cf_${esc(f.key)}" name="${esc(f.key)}" data-key="${esc(f.key)}" data-label="${esc(f.label)}"${required}>
                <option value="">${esc(f.placeholder || t('selectGender'))}</option>
                <option value="M">${esc(t('male'))}</option>
                <option value="F">${esc(t('female'))}</option>
              </select>
              <div class="field-error" id="cf_${esc(f.key)}_err"></div>
            </div>
          `);
          return;
        }
        parts.push(`
          <div class="form-group">
            <label class="form-label" for="cf_${esc(f.key)}">${esc(f.label)}${reqMark}</label>
            <input class="form-control" id="cf_${esc(f.key)}" name="${esc(f.key)}" type="${inputType(f.key)}"
              value="${esc(f.defaultValue)}" placeholder="${esc(defaultPlaceholder(f.key, f.placeholder))}" data-key="${esc(f.key)}" data-label="${esc(f.label)}"${required} ${inputAttrs(f.key)}>
            <div class="field-error" id="cf_${esc(f.key)}_err"></div>
          </div>
        `);
      });
      fieldHost.innerHTML = parts.join('');
      bindFieldValidation();
    }

    async function loadForm() {
      try {
        const browserLanguages = (navigator.languages?.length ? navigator.languages : [navigator.language || 'en'])
          .map(value => String(value).toLowerCase().split('-')[0]).join(',');
        const requestedLanguage = new URLSearchParams(location.search).get('lang') || browserLanguages;
        const res = await fetch(`/api/campaigns/form/${encodeURIComponent(campaignId)}?lang=${encodeURIComponent(requestedLanguage)}`);
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || t('loadError'));
        locale = chooseLocale(data.data.supported_languages);
        applyLocale();
        data.data.fields = (data.data.fields || []).map((f) => ({ ...f, label: FIELD_LABELS[locale]?.[f.key] || FIELD_LABELS.en[f.key] || f.label }));
        document.getElementById('title').textContent = data.data.campaign_name || t('formTitle');
        document.getElementById('description').textContent = data.data.description || '';
        renderFields(data.data.fields || []);
        if (previewMode) {
          submitBtn.disabled = true;
          submitBtn.textContent = t('preview');
        }
      } catch (err) {
        fieldHost.innerHTML = `<div class="empty-state">${esc(err.message || t('loadError'))}</div>`;
        submitBtn.disabled = true;
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (previewMode) return;
      const controls = Array.from(fieldHost.querySelectorAll('[data-key]'));
      const valid = controls.every((el) => validateField(el, true));
      if (!valid) return;
      const payload = Object.fromEntries(new FormData(form).entries());
      ['birth_ymd', 'birth_ym', 'mobile', 'phone', 'postal_code'].forEach((key) => {
        if (payload[key] != null) payload[key] = digitsOnly(payload[key]);
      });
      ['email', 'referrer_email'].forEach((key) => {
        if (payload[key] != null) payload[key] = String(payload[key]).trim();
      });
      submitBtn.disabled = true;
      submitBtn.textContent = t('submitting');
      try {
        const res = await fetch(`/api/campaigns/form/${encodeURIComponent(campaignId)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) return MxAlert.error(locale === 'ko' && data.error ? data.error : t('submitError'));
        await MxAlert.alert(locale === 'ko' && data.message ? data.message : t('success'), { title: t('complete') });
        form.reset();
      } catch {
        MxAlert.error(t('serverError'));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = t('submit');
      }
    });

    loadForm();
  </script>
</body>
</html>
