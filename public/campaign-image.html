<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전문 외국환자관리 CRM</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/common.css">
  <style>
    body { margin:0; background:#f5f7fb; min-height:100vh; }
    .ci-shell { width:min(94vw, 760px); margin:36px auto; }
    .ci-panel { background:#fff; border:1px solid var(--gray-200); border-radius:8px; overflow:hidden; box-shadow:0 2px 10px rgba(15,23,42,.08); }
    .ci-head { padding:20px 24px; background:#2563eb; color:#fff; text-align:center; }
    .ci-head h1 { margin:0; font-size:22px; letter-spacing:0; }
    .ci-head p { margin:8px 0 0; color:#dbeafe; font-size:14px; line-height:1.55; }
    .ci-body { padding:20px; text-align:center; }
    .ci-image-link { display:block; cursor:pointer; border-radius:8px; overflow:hidden; border:1px solid var(--gray-200); background:#f9fafb; }
    .ci-image { display:block; width:100%; height:auto; }
    .ci-hint { margin-top:12px; font-size:13px; color:var(--gray-500); }
    .ci-empty { padding:48px 20px; text-align:center; color:var(--gray-500); }
    @media (max-width:640px) {
      .ci-shell { margin:16px auto; }
      .ci-head, .ci-body { padding:18px; }
    }
  </style>
</head>
<body>
  <main class="ci-shell">
    <section class="ci-panel">
      <div class="ci-head">
        <h1 id="ciTitle">캠페인 이미지</h1>
        <p id="ciDesc"></p>
      </div>
      <div class="ci-body" id="ciBody">
        <div class="ci-empty">이미지를 불러오는 중입니다.</div>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const campaignId = params.get('id') || location.pathname.split('/').filter(Boolean).pop();
    const body = document.getElementById('ciBody');

    function esc(v) {
      return String(v || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }
    function youtubeEmbed(url) {
      const match = String(url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
      return match ? `https://www.youtube.com/embed/${match[1]}` : '';
    }

    async function loadCampaignImage() {
      try {
        const lang = (navigator.languages?.length ? navigator.languages : [navigator.language || 'en'])
          .map(value => String(value).toLowerCase().split('-')[0]).join(',');
        const res = await fetch(`/api/campaigns/image-page/${encodeURIComponent(campaignId)}?lang=${encodeURIComponent(lang)}`);
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || '이미지를 불러오지 못했습니다.');
        const c = data.data;
        document.getElementById('ciTitle').textContent = c.campaign_name || '캠페인 이미지';
        document.getElementById('ciDesc').textContent = c.description || '';
        const assets = [];
        if (c.image_url) assets.push(`<a class="ci-image-link" href="${esc(c.form_url)}"><img class="ci-image" src="${esc(c.image_url)}" alt="${esc(c.campaign_name || 'Campaign image')}"></a>`);
        if (c.html_url) assets.push(`<iframe src="${esc(c.html_url)}" title="HTML advertisement" style="width:100%;height:520px;border:1px solid var(--gray-200);border-radius:8px"></iframe>`);
        const yt = youtubeEmbed(c.youtube_url);
        if (yt) assets.push(`<div style="position:relative;padding-top:56.25%;overflow:hidden;border-radius:8px"><iframe src="${esc(yt)}" title="YouTube advertisement" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe></div>`);
        body.innerHTML = `${assets.join('<div style="height:14px"></div>')}<div class="ci-hint"><a class="btn btn-primary" href="${esc(c.form_url)}">Open form</a></div>`;
      } catch (err) {
        body.innerHTML = `<div class="ci-empty">${esc(err.message || '이미지를 불러오지 못했습니다.')}</div>`;
      }
    }

    loadCampaignImage();
  </script>
</body>
</html>
