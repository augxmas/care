<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전문 외국환자관리 CRM</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .login-footer { text-align:center; margin-top:20px; font-size:13px; color: var(--gray-500); }
    .login-footer a { color: var(--primary); text-decoration:none; font-weight:600; }
    .login-footer a:hover { text-decoration:underline; }
    .login-info-box {
      background: #f0f4ff;
      border: 1px solid #c7d7fc;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #3b5999;
    }
    .divider { border: none; border-top: 1px solid var(--gray-200); margin: 20px 0; }
    .password-wrap { position:relative; }
    .password-wrap .toggle-pw {
      position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--gray-400); font-size: 16px;
    }
    .forgot-link {
      display:block; text-align:right; font-size:12px; color:var(--gray-400);
      margin-top:6px; cursor:pointer; text-decoration:underline;
    }
    .forgot-link:hover { color:var(--primary); }
    .pw-strength { height:4px; border-radius:2px; margin-top:6px; transition:all .3s; background:#e5e7eb; }
    /* 로그인 유형 탭 */
    .role-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .role-tab {
      cursor: pointer; user-select: none;
      padding: 10px 8px; border: 1.5px solid var(--gray-300); border-radius: 8px;
      background: #fff; text-align: center; font-size: 13px; font-weight: 600;
      color: var(--gray-700); transition: all .12s;
    }
    .role-tab input { position: absolute; opacity: 0; pointer-events: none; }
    .role-tab:hover { border-color: var(--primary); color: var(--primary); }
    .role-tab:has(input:checked) {
      background: var(--primary); color: #fff; border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(37,99,235,.25);
    }
    /* 리셋폼 overlay (공통 css가 있을 경우 활용, 없으면 인라인) */
    #resetOverlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.45);
      z-index:9999; align-items:center; justify-content:center;
    }
    #resetOverlay.visible { display:flex; }
    #resetOverlay .box {
      background:#fff; border-radius:12px; width:100%; max-width:460px;
      box-shadow:0 8px 32px rgba(0,0,0,.18); overflow:hidden;
    }
    #resetOverlay .box-header {
      background:var(--primary); color:#fff; padding:18px 24px;
      font-size:16px; font-weight:700; text-align:center;
    }
    #resetOverlay .box-body { padding:24px; }
    #resetOverlay .box-footer {
      padding:16px 24px; border-top:1px solid var(--gray-200);
      display:flex; justify-content:center;
    }
    #hospitalSelectOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10000;align-items:center;justify-content:center;padding:20px}
    #hospitalSelectOverlay.visible{display:flex}.hospital-select-box{width:min(760px,100%);max-height:88vh;overflow:hidden;display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 18px 55px rgba(0,0,0,.25)}
    .hospital-select-head{position:relative;padding:24px 58px 16px;text-align:center;border-bottom:1px solid var(--gray-200)}.hospital-select-head h2{margin:0 0 7px;font-size:20px;color:var(--primary)}.hospital-select-head p{margin:0;color:var(--gray-500);font-size:13px}
    .hospital-select-close{position:absolute;right:18px;top:16px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--gray-500);font-size:27px;line-height:1;cursor:pointer}.hospital-select-close:hover,.hospital-select-close:focus{background:#eff6ff;color:var(--primary);outline:none}
    .hospital-select-list{padding:20px 28px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}.hospital-choice{display:block;cursor:pointer}.hospital-choice input{position:absolute;opacity:0}
    .hospital-choice-card{height:100%;box-sizing:border-box;padding:17px;border:1.5px solid var(--gray-200);border-radius:10px;transition:.15s}.hospital-choice input:checked+.hospital-choice-card{border-color:var(--primary);background:#eff6ff;box-shadow:0 0 0 1px var(--primary)}
    .hospital-choice-name{font-weight:800;margin-bottom:8px}.hospital-choice-meta{color:var(--gray-500);font-size:12px;line-height:1.7}.hospital-select-foot{padding:16px 28px;border-top:1px solid var(--gray-200);text-align:center}
    #hospitalManageBtn{min-width:180px;justify-content:center;background:var(--primary);border-color:var(--primary);color:#fff}#hospitalManageBtn:hover:not(:disabled){background:#1d4ed8;border-color:#1d4ed8}#hospitalManageBtn:disabled{opacity:.4;cursor:not-allowed}@media(max-width:600px){.hospital-select-list{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>모노라마 병원 CRM 시스템</h1>
      <p id="authSubtitle">기관 로그인</p>
    </div>

    <!-- ── 로그인 폼 ── -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label">로그인 유형 <span class="required">*</span></label>
        <div class="role-tabs" id="roleTabs">
          <label class="role-tab"><input type="radio" name="role" value="advertiser" checked><span>👤 관리자</span></label>
          <label class="role-tab"><input type="radio" name="role" value="doctor"><span>🩺 의사</span></label>
          <label class="role-tab"><input type="radio" name="role" value="manager"><span>👩‍💼 담당자</span></label>
        </div>
      </div>
      <div class="form-group" id="bizNoGroup">
        <label class="form-label" for="bizNo">사업자등록번호 <span class="required">*</span></label>
        <input class="form-control" type="text" id="bizNo" placeholder="000-00-00000" inputmode="numeric">
      </div>
      <div class="form-group">
        <label class="form-label" for="email">이메일 <span class="required">*</span></label>
        <input class="form-control" type="email" id="email" placeholder="이메일" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">비밀번호 <span class="required">*</span></label>
        <div class="password-wrap">
          <input class="form-control" type="password" id="password" placeholder="비밀번호" autocomplete="current-password" required>
          <button type="button" class="toggle-pw" id="togglePw">👁</button>
        </div>
        <span class="forgot-link" id="forgotLink">비밀번호를 잊으셨나요?</span>
      </div>
      <div style="display:flex;gap:18px;margin-bottom:14px;font-size:13px;color:var(--gray-600);flex-wrap:wrap">
        <label class="form-check">
          <input type="checkbox" id="rememberBizNo" checked>
          사업자등록번호 저장
        </label>
        <label class="form-check">
          <input type="checkbox" id="rememberEmail" checked>
          이메일 저장
        </label>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:8px;justify-content:center" id="loginBtn">
        로그인
      </button>
    </form>

    <!-- ── 비밀번호 분실 섹션 ── -->
    <div id="forgotSection" style="display:none">
      <hr class="divider">
      <div class="login-info-box">
        사업자등록번호와 이메일을 입력하시면<br>임시비밀번호를 이메일로 발송해 드립니다.
      </div>
      <div class="form-group">
        <label class="form-label" for="fg_bizno">사업자등록번호 <span class="required">*</span></label>
        <input class="form-control" type="text" id="fg_bizno" placeholder="000-00-00000" inputmode="numeric">
      </div>
      <div class="form-group">
        <label class="form-label" for="fg_email">이메일 <span class="required">*</span></label>
        <input class="form-control" type="email" id="fg_email" placeholder="담당자 이메일">
      </div>
      <button type="button" class="btn btn-outline btn-lg" style="width:100%;justify-content:center" id="forgotBtn">
        임시비밀번호 발송
      </button>
      <button type="button" class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px;justify-content:center" id="forgotCancelBtn">
        로그인으로 돌아가기
      </button>
    </div>

    <div class="login-footer" id="loginFooter">
      <p>기관 계정이 없으신가요? <a href="/admin/register">회원가입</a></p>
    </div>
  </div>
</div>

<!-- 비밀번호 재설정 오버레이 (임시비밀번호 로그인 후) -->
<div id="hospitalSelectOverlay"><div class="hospital-select-box"><div class="hospital-select-head"><h2>관리할 병원을 선택하세요</h2><p>대행사와 승인된 관계의 병원만 표시됩니다.</p><button type="button" class="hospital-select-close" id="hospitalSelectClose" aria-label="병원 선택 창 닫기">×</button></div><div class="hospital-select-list" id="hospitalSelectList"></div><div class="hospital-select-foot"><button type="button" class="btn" id="hospitalManageBtn" disabled>선택한 병원 관리</button></div></div></div>

<div id="resetOverlay">
  <div class="box">
    <div class="box-header">🔐 비밀번호 재설정 필요</div>
    <div class="box-body">
      <div class="login-info-box">
        임시비밀번호로 로그인하셨습니다.<br>
        보안을 위해 새 비밀번호로 변경해 주세요.
      </div>
      <div class="form-group">
        <label class="form-label">현재 비밀번호 (임시비밀번호) <span class="required">*</span></label>
        <input class="form-control" type="password" id="rp_current" placeholder="이메일로 발송된 임시비밀번호">
      </div>
      <div class="form-group">
        <label class="form-label">새 비밀번호 <span class="required">*</span></label>
        <input class="form-control" type="password" id="rp_new" placeholder="8자 이상, 대소문자+숫자+특수문자">
        <div class="pw-strength" id="rpPwStrength"></div>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">새 비밀번호 확인 <span class="required">*</span></label>
        <input class="form-control" type="password" id="rp_new2" placeholder="비밀번호 재입력">
        <div class="form-hint" id="rpPw2Hint" style="margin-top:4px"></div>
      </div>
    </div>
    <div class="box-footer">
      <button class="btn btn-primary" style="min-width:160px;justify-content:center" id="resetPwBtn">비밀번호 변경</button>
    </div>
  </div>
</div>

<script src="/js/alert.js"></script>
<script>
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function showHospitalSelector(){
    const overlay=document.getElementById('hospitalSelectOverlay'),list=document.getElementById('hospitalSelectList'),manageBtn=document.getElementById('hospitalManageBtn');
    overlay.classList.add('visible');manageBtn.disabled=true;list.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:35px;color:#6b7280">연계 병원을 불러오는 중입니다...</div>';
    try{
      const res=await fetch('/api/auth/agency-hospitals'),data=await res.json();if(!res.ok)throw Error(data.error||'연계 병원을 불러오지 못했습니다.');
      if(!data.data.length){list.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:35px"><b>관리할 수 있는 병원이 없습니다.</b><p style="color:#6b7280;font-size:13px">승인된 병원 관계가 등록된 후 이용할 수 있습니다.</p></div>';return}
      list.innerHTML=data.data.map(h=>`<label class="hospital-choice"><input type="radio" name="selectedHospital" value="${h.id}"><div class="hospital-choice-card"><div class="hospital-choice-name">${esc(h.company_name)}</div><div class="hospital-choice-meta">대표자 ${esc(h.ceo_name||'-')}<br>사업자등록번호 ${esc(h.business_no||'-')}<br>일련번호 ${esc(h.serial_no||'-')}<br>진료과목 ${esc(h.medical_subjects||'-')}</div></div></label>`).join('');
      list.querySelectorAll('input[name="selectedHospital"]').forEach(input=>input.addEventListener('change',()=>{manageBtn.disabled=false}));
    }catch(error){list.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:35px;color:#dc2626">${esc(error.message)}</div>`}
  }
  document.getElementById('hospitalManageBtn').addEventListener('click',async function(){
    const selected=document.querySelector('input[name="selectedHospital"]:checked');if(!selected)return;this.disabled=true;
    try{const res=await fetch('/api/auth/select-agency-hospital',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hospital_id:Number(selected.value)})}),data=await res.json();if(!res.ok)throw Error(data.error||'병원을 선택하지 못했습니다.');window.location.href='/admin/dashboard'}
    catch(error){await MxAlert.error(error.message);this.disabled=false}
  });
  document.getElementById('hospitalSelectClose').addEventListener('click',()=>{
    document.getElementById('hospitalSelectOverlay').classList.remove('visible');
  });

  // 이미 로그인되어 있으면 대시보드로
  fetch('/api/auth/me').then(r => r.json()).then(d => {
    if (!d.ok) return;
    if (d.user?.role === 'advertiser' && !d.user?.selected_hospital) showHospitalSelector();
    else window.location.href = '/admin/dashboard';
  }).catch(() => {});

  /* ── 저장된 로그인 정보 복원 ── */
  const REMEMBER_KEY = 'monorama_login_remember';
  try {
    const saved = JSON.parse(localStorage.getItem(REMEMBER_KEY) || 'null');
    if (saved) {
      if (saved.business_no) {
        document.getElementById('bizNo').value = saved.business_no;
        document.getElementById('rememberBizNo').checked = true;
      } else {
        document.getElementById('rememberBizNo').checked = false;
      }
      if (saved.email) {
        document.getElementById('email').value = saved.email;
        document.getElementById('rememberEmail').checked = true;
      } else {
        document.getElementById('rememberEmail').checked = false;
      }
    }
  } catch {}

  /* ── 사업자등록번호 포맷 ── */
  const bizNoEl = document.getElementById('bizNo');
  bizNoEl.addEventListener('input', () => {
    bizNoEl.value = bizNoEl.value.replace(/\D/g, '').slice(0, 10);
  });
  bizNoEl.addEventListener('blur', () => {
    const d = bizNoEl.value.replace(/\D/g, '');
    if (d.length === 10) bizNoEl.value = d.replace(/(\d{3})(\d{2})(\d{5})/, '$1-$2-$3');
  });

  /* ── 역할 선택: 사업자등록번호 표시 토글 ── */
  function getSelectedRole() {
    const r = document.querySelector('input[name="role"]:checked');
    return r ? r.value : 'advertiser';
  }
  function applyRoleUI() {
    const role = getSelectedRole();
    document.getElementById('bizNoGroup').style.display = '';
    document.getElementById('rememberBizNo').parentElement.style.display = '';
    const emailEl = document.getElementById('email');
    emailEl.placeholder = role === 'doctor' ? '의사 이메일' : (role === 'manager' ? '담당자 이메일' : '관리자 이메일');
  }
  document.querySelectorAll('input[name="role"]').forEach(r => r.addEventListener('change', applyRoleUI));
  applyRoleUI();

  /* ── 비밀번호 표시 전환 ── */
  document.getElementById('togglePw').addEventListener('click', function() {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
    this.textContent = pw.type === 'password' ? '👁' : '🙈';
  });

  /* ── 로그인 폼 제출 ── */
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const role        = getSelectedRole();
    const business_no = document.getElementById('bizNo').value.trim();
    const email       = document.getElementById('email').value.trim();
    const password    = document.getElementById('password').value;
    const btn         = document.getElementById('loginBtn');

    if (!business_no || !email || !password)
      return MxAlert.error('사업자등록번호, 이메일, 비밀번호를 모두 입력하세요.');

    {
      const keepBiz   = document.getElementById('rememberBizNo').checked;
      const keepEmail = document.getElementById('rememberEmail').checked;
      if (keepBiz || keepEmail) {
        localStorage.setItem(REMEMBER_KEY, JSON.stringify({
          business_no: keepBiz   ? business_no : '',
          email:       keepEmail ? email       : '',
        }));
      } else {
        localStorage.removeItem(REMEMBER_KEY);
      }
    }

    btn.disabled    = true;
    btn.textContent = '로그인 중...';

    try {
      const res  = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role, business_no, email, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        MxAlert.error(data.error || '로그인에 실패했습니다.');
        return;
      }

      if (data.resetRequired) {
        // 임시비밀번호 → 비밀번호 재설정 오버레이 표시
        document.getElementById('resetOverlay').classList.add('visible');
        return;
      }

      let welcomeMsg = `<strong>${data.company_name || ''}</strong> ${data.contact_name}님, 환영합니다!<br>로그인에 성공하였습니다.<br><br>많은 이용을 바랍니다.`;
      if (data.prevIp && data.prevAt) {
        const dt = new Date(data.prevAt).toLocaleString('ko-KR');
        welcomeMsg += `<br><br><small style="color:#6b7280">마지막 접속: ${data.prevIp} (${dt})</small>`;
      }

      await MxAlert.success(welcomeMsg, {
        title: '로그인 성공',
        confirmText: '시작하기',
        confirmColor: 'primary',
        type: 'info',
        icon: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17l-5-5" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      });
      if (data.role === 'advertiser') await showHospitalSelector();
      else window.location.href = '/admin/dashboard';
    } catch (err) {
      MxAlert.error('서버 연결에 실패했습니다.');
    } finally {
      btn.disabled    = false;
      btn.textContent = '로그인';
    }
  });

  /* ── 비밀번호 분실 토글 ── */
  document.getElementById('forgotLink').addEventListener('click', () => {
    document.getElementById('loginForm').style.display      = 'none';
    document.getElementById('forgotSection').style.display  = 'block';
    document.getElementById('loginFooter').style.display    = 'none';
    document.getElementById('authSubtitle').textContent     = '임시비밀번호 발급';
    // 로그인 폼의 bizNo 값이 있으면 자동 복사
    const biz = document.getElementById('bizNo').value;
    if (biz) document.getElementById('fg_bizno').value = biz;
    const em = document.getElementById('email').value;
    if (em) document.getElementById('fg_email').value = em;
  });

  document.getElementById('forgotCancelBtn').addEventListener('click', () => {
    document.getElementById('loginForm').style.display      = 'block';
    document.getElementById('forgotSection').style.display  = 'none';
    document.getElementById('loginFooter').style.display    = 'block';
    document.getElementById('authSubtitle').textContent     = '기관 로그인';
  });

  /* ── 사업자등록번호 포맷 (분실 폼) ── */
  const fgBizEl = document.getElementById('fg_bizno');
  fgBizEl.addEventListener('input', () => {
    fgBizEl.value = fgBizEl.value.replace(/\D/g, '').slice(0, 10);
  });
  fgBizEl.addEventListener('blur', () => {
    const d = fgBizEl.value.replace(/\D/g, '');
    if (d.length === 10) fgBizEl.value = d.replace(/(\d{3})(\d{2})(\d{5})/, '$1-$2-$3');
  });

  /* ── 임시비밀번호 발송 ── */
  document.getElementById('forgotBtn').addEventListener('click', async function() {
    const business_no = document.getElementById('fg_bizno').value.trim();
    const email       = document.getElementById('fg_email').value.trim();
    if (!business_no || !email) return MxAlert.error('사업자등록번호와 이메일을 입력하세요.');

    this.disabled    = true;
    this.textContent = '발송 중...';
    try {
      const res  = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ business_no, email }),
      });
      const data = await res.json();
      if (!res.ok) return MxAlert.error(data.error || '처리에 실패했습니다.');
      await MxAlert.success(data.message || '임시비밀번호가 발송되었습니다.', { title: '발송 완료', confirmText: '로그인하기' });
      // 로그인 폼으로 돌아가며 이메일 자동 입력
      document.getElementById('loginForm').style.display     = 'block';
      document.getElementById('forgotSection').style.display = 'none';
      document.getElementById('loginFooter').style.display   = 'block';
      document.getElementById('authSubtitle').textContent    = '기관 로그인';
      document.getElementById('email').value = email;
      document.getElementById('bizNo').value = business_no;
      document.getElementById('password').focus();
    } catch { MxAlert.error('서버 연결에 실패했습니다.'); }
    finally { this.disabled = false; this.textContent = '임시비밀번호 발송'; }
  });

  /* ── 비밀번호 재설정 오버레이 ── */
  const PW_REGEX = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{8,}$/;

  document.getElementById('rp_new').addEventListener('input', function() {
    const bar = document.getElementById('rpPwStrength');
    const v = this.value;
    let score = 0;
    if (v.length >= 8)           score++;
    if (/[A-Z]/.test(v))         score++;
    if (/[a-z]/.test(v))         score++;
    if (/[0-9]/.test(v))         score++;
    if (/[^A-Za-z0-9]/.test(v))  score++;
    const colors = ['#ef4444','#f97316','#eab308','#22c55e','#16a34a'];
    bar.style.width      = (score * 20) + '%';
    bar.style.background = colors[score - 1] || '#e5e7eb';
    checkRpPw2();
  });

  document.getElementById('rp_new2').addEventListener('input', checkRpPw2);
  function checkRpPw2() {
    const hint = document.getElementById('rpPw2Hint');
    const p1   = document.getElementById('rp_new').value;
    const p2   = document.getElementById('rp_new2').value;
    if (!p2) { hint.textContent = ''; return; }
    if (p1 === p2) { hint.textContent = '✅ 비밀번호가 일치합니다.'; hint.style.color = 'var(--success)'; }
    else           { hint.textContent = '❌ 비밀번호가 일치하지 않습니다.'; hint.style.color = 'var(--danger)'; }
  }

  document.getElementById('resetPwBtn').addEventListener('click', async function() {
    const current_password = document.getElementById('rp_current').value;
    const new_password     = document.getElementById('rp_new').value;
    const new_password2    = document.getElementById('rp_new2').value;

    if (!current_password) return MxAlert.error('현재 비밀번호(임시비밀번호)를 입력하세요.');
    if (!PW_REGEX.test(new_password))
      return MxAlert.error('새 비밀번호가 보안 요건을 충족하지 않습니다.<br>대소문자, 숫자, 특수문자를 포함한 8자리 이상이어야 합니다.');
    if (new_password !== new_password2)
      return MxAlert.error('새 비밀번호가 일치하지 않습니다.');

    this.disabled    = true;
    this.textContent = '변경 중...';
    try {
      const res  = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_password, new_password }),
      });
      const data = await res.json();
      if (!res.ok) return MxAlert.error(data.error || '변경에 실패했습니다.');
      await MxAlert.success('비밀번호가 변경되었습니다. 대시보드로 이동합니다.', { title: '변경 완료' });
      document.getElementById('resetOverlay').classList.remove('visible');
      await showHospitalSelector();
    } catch { MxAlert.error('서버 연결에 실패했습니다.'); }
    finally { this.disabled = false; this.textContent = '비밀번호 변경'; }
  });
</script>
</body>
</html>
