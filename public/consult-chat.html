<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전문 외국환자관리 CRM</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    body { background:var(--gray-50,#f8fafc); }
    .ch-wrap { max-width:680px; margin:24px auto; padding:0 12px; }
    .ch-card { background:#fff; border:1px solid var(--gray-200,#e5e7eb); border-radius:12px; padding:22px; }
    .ch-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .ch-msgs { height:55vh; overflow-y:auto; border:1px solid var(--gray-200,#e5e7eb); border-radius:8px; padding:12px; background:#fafafa; }
    .ch-msg { margin-bottom:10px; display:flex; }
    .ch-msg.me { justify-content:flex-end; }
    .ch-bubble { max-width:75%; padding:8px 12px; border-radius:12px; background:#fff; border:1px solid var(--gray-200,#e5e7eb); font-size:14px; }
    .ch-msg.me .ch-bubble { background:#2563eb; color:#fff; }
    .ch-orig { font-size:11px; opacity:.7; margin-top:4px; border-top:1px dashed rgba(0,0,0,.15); padding-top:3px; }
    .ch-msg.me .ch-orig { border-top-color:rgba(255,255,255,.3); }
    .ch-att a { color:inherit; text-decoration:underline; font-size:13px; }
    .ch-drop { border:2px dashed var(--gray-300,#cbd5e1); border-radius:8px; text-align:center; color:#9ca3af; font-size:12px; padding:6px; margin-top:8px; }
    .ch-drop.over { border-color:var(--primary,#2563eb); background:#eff6ff; color:#2563eb; }
    #joinBtn, #sendBtn { display:flex; align-items:center; justify-content:center; text-align:center; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="ch-wrap">
    <!-- 본인확인 -->
    <div class="ch-card" id="authCard">
      <h3 id="hosTitle" style="margin:0 0 6px">상담 채팅</h3>
      <p id="authInfo" style="font-size:13px;color:#6b7280;margin:0 0 14px"></p>
      <div class="form-group"><label class="form-label" data-i18n="email">이메일</label><input type="email" class="form-control" id="email"></div>
      <div class="form-group"><label class="form-label"><span data-i18n="code">인증코드</span> <span style="color:#2563eb" data-i18n="password">(비밀번호)</span></label>
        <div style="position:relative">
          <input type="password" class="form-control" id="code" data-i18n-placeholder="codePlaceholder" autocomplete="off" style="padding-right:40px">
          <button type="button" id="codeToggle" data-i18n-title="toggleCode" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:#6b7280;padding:4px">👁</button>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" id="joinBtn" style="flex:1" data-i18n="join">입장</button>
        <button class="btn btn-ghost" id="sendBtn" style="flex:1" data-i18n="resend">인증코드 재발급</button>
      </div>
    </div>

    <!-- 번역 언어 선택 (미등록 고객) -->
    <div class="ch-card hidden" id="langCard">
      <h3 style="margin:0 0 6px" data-i18n="needTranslation">상담을 위해 번역이 필요하신가요?</h3>
      <p style="font-size:13px;color:#6b7280;margin:0 0 14px" data-i18n="translationInfo">상담 담당자와 사용하는 언어가 다르다면, 메시지를 자동으로 번역해 드립니다.</p>
      <div style="display:flex;gap:8px;margin-bottom:6px">
        <button class="btn btn-primary" id="needYes" style="flex:1" data-i18n="yesTranslation">예, 번역이 필요해요</button>
        <button class="btn btn-ghost" id="needNo" style="flex:1" data-i18n="noTranslation">아니요, 필요 없어요</button>
      </div>
      <div id="langSelectWrap" style="display:none;margin-top:12px">
        <div class="form-group"><label class="form-label" data-i18n="selectLanguage">사용 언어를 선택하세요</label>
          <select class="form-control" id="langSel"></select></div>
        <div class="form-group" id="otherWrap" style="display:none"><label class="form-label" data-i18n="otherLanguage">언어 선택 (기타)</label>
          <select class="form-control" id="otherSel"></select></div>
        <button class="btn btn-primary" id="langConfirm" style="width:100%" data-i18n="startChat">채팅 시작</button>
      </div>
    </div>

    <!-- 채팅 -->
    <div class="ch-card hidden" id="chatCard">
      <div class="ch-head">
        <div style="font-weight:700" id="chatTitle">상담 채팅</div>
        <div style="font-size:12px;color:#6b7280;display:flex;gap:10px;align-items:center">
          <label style="display:flex;gap:4px;align-items:center"><input type="radio" name="translateMode" value="both" checked> <span data-i18n="originalAndTranslation">원문+번역</span></label>
          <label style="display:flex;gap:4px;align-items:center"><input type="radio" name="translateMode" value="translated"> <span data-i18n="translation">번역</span></label>
        </div>
      </div>
      <div class="ch-msgs" id="msgs"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <input type="text" class="form-control" id="msgInput" data-i18n-placeholder="messagePlaceholder" style="flex:1">
        <button class="btn btn-primary" id="sendMsgBtn" data-i18n="send">전송</button>
      </div>
      <div class="ch-drop" id="dropZone" data-i18n="dropFile">📎 파일을 여기로 드래그하거나 클릭하여 첨부 (이미지·PDF·문서, txt 계열 불가)</div>
      <input type="file" id="fileInput" class="hidden">
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/alert.js"></script>
  <script>
    const P = new URLSearchParams(location.search);
    const H = P.get('h'), POST = P.get('p'), T = P.get('t');
    const LANG=(()=>{let saved='';try{saved=localStorage.getItem('mods_language')||''}catch{}const raw=String(P.get('lang')||saved||navigator.languages?.[0]||navigator.language||'en').toLowerCase().split('-')[0];return raw==='ko'||raw==='th'?raw:'en';})();
    document.documentElement.lang=LANG;
    const $ = id => document.getElementById(id);
    const COPY={
      ko:{pageTitle:'상담 채팅',chat:'상담 채팅',authInfo:'채팅 참여를 위해 <strong>이메일과 인증코드(비밀번호)</strong>로 본인확인이 필요합니다. 이전에 받은 코드가 있으면 바로 입장하시고, 모르시면 재발급 받으세요.',email:'이메일',code:'인증코드',password:'(비밀번호)',codePlaceholder:'메일로 받은 6자리 코드',toggleCode:'코드 표시/숨기기',join:'입장',resend:'인증코드 재발급',needTranslation:'상담을 위해 번역이 필요하신가요?',translationInfo:'상담 담당자와 사용하는 언어가 다르다면, 메시지를 자동으로 번역해 드립니다.',yesTranslation:'예, 번역이 필요해요',noTranslation:'아니요, 필요 없어요',selectLanguage:'사용 언어를 선택하세요',otherLanguage:'언어 선택 (기타)',startChat:'채팅 시작',originalAndTranslation:'원문+번역',translation:'번역',original:'원문',messagePlaceholder:'메시지 입력',send:'전송',dropFile:'📎 파일을 여기로 드래그하거나 클릭하여 첨부 (이미지·PDF·문서, txt 계열 불가)',attachment:'첨부파일',requestFailed:'요청 실패',enterEmail:'이메일을 입력하세요.',codeSent:'인증코드를 메일로 보냈습니다. 이 코드가 비밀번호입니다.',enterCredentials:'이메일과 인증코드를 입력하세요.',otherOption:'기타 (목록에 없는 언어)',uploadFailed:'업로드 실패'},
      th:{pageTitle:'แชตปรึกษาออนไลน์',chat:'แชตปรึกษาออนไลน์',authInfo:'เพื่อเข้าร่วมแชต โปรดยืนยันตัวตนด้วย <strong>อีเมลและรหัสยืนยัน (รหัสผ่าน)</strong> หากมีรหัสเดิมให้เข้าใช้งานได้ทันที หรือขอรหัสใหม่หากจำไม่ได้',email:'อีเมล',code:'รหัสยืนยัน',password:'(รหัสผ่าน)',codePlaceholder:'รหัส 6 หลักที่ได้รับทางอีเมล',toggleCode:'แสดง/ซ่อนรหัส',join:'เข้าสู่แชต',resend:'ขอรหัสยืนยันใหม่',needTranslation:'ต้องการแปลภาษาเพื่อรับคำปรึกษาหรือไม่?',translationInfo:'หากคุณและเจ้าหน้าที่ใช้ภาษาต่างกัน ระบบจะแปลข้อความให้อัตโนมัติ',yesTranslation:'ใช่ ต้องการแปลภาษา',noTranslation:'ไม่ ไม่ต้องการ',selectLanguage:'เลือกภาษาที่ใช้',otherLanguage:'เลือกภาษา (อื่น ๆ)',startChat:'เริ่มแชต',originalAndTranslation:'ต้นฉบับ+คำแปล',translation:'คำแปล',original:'ต้นฉบับ',messagePlaceholder:'พิมพ์ข้อความ',send:'ส่ง',dropFile:'📎 ลากไฟล์มาวางหรือคลิกเพื่อแนบ (รูปภาพ PDF และเอกสาร ไม่รองรับไฟล์ txt)',attachment:'ไฟล์แนบ',requestFailed:'ดำเนินการไม่สำเร็จ',enterEmail:'กรุณากรอกอีเมล',codeSent:'ส่งรหัสยืนยันทางอีเมลแล้ว รหัสนี้คือรหัสผ่านแชต',enterCredentials:'กรุณากรอกอีเมลและรหัสยืนยัน',otherOption:'อื่น ๆ (ภาษาที่ไม่มีในรายการ)',uploadFailed:'อัปโหลดไม่สำเร็จ'},
      en:{pageTitle:'Consultation chat',chat:'Consultation chat',authInfo:'To join the chat, verify your identity with your <strong>email and verification code (password)</strong>. Use your existing code or request a new one if needed.',email:'Email',code:'Verification code',password:'(Password)',codePlaceholder:'6-digit code received by email',toggleCode:'Show/hide code',join:'Join',resend:'Resend verification code',needTranslation:'Do you need translation for your consultation?',translationInfo:'If you and the staff use different languages, messages will be translated automatically.',yesTranslation:'Yes, translate messages',noTranslation:'No, not needed',selectLanguage:'Select your language',otherLanguage:'Select language (Other)',startChat:'Start chat',originalAndTranslation:'Original+Translation',translation:'Translation',original:'Original',messagePlaceholder:'Type a message',send:'Send',dropFile:'📎 Drag a file here or click to attach (images, PDFs and documents; txt files are not supported)',attachment:'Attachment',requestFailed:'Request failed',enterEmail:'Enter your email.',codeSent:'The verification code was sent by email. This code is your chat password.',enterCredentials:'Enter your email and verification code.',otherOption:'Other (language not listed)',uploadFailed:'Upload failed'}
    };
    const tr=key=>COPY[LANG][key]||COPY.en[key]||key;
    document.title=tr('pageTitle');
    document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=tr(el.dataset.i18n)});
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{el.placeholder=tr(el.dataset.i18nPlaceholder)});
    document.querySelectorAll('[data-i18n-title]').forEach(el=>{el.title=tr(el.dataset.i18nTitle)});
    $('authInfo').innerHTML=tr('authInfo');
    let chatToken=null, convId=null, socket=null, showBoth=true;
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    // 첨부 렌더 — 이미지는 인라인 썸네일(클릭 시 원본), 그 외는 링크
    function attachHtml(att){
      const url = att.path && att.path.charAt(0)==='/' ? att.path : '/'+(att.path||'');
      const isImg = /^image\//i.test(att.mime||'') || /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(att.name||'');
      if(isImg) return `<a href="${esc(url)}" target="_blank" style="display:block"><img src="${esc(url)}" alt="${esc(att.name||'')}" style="max-width:100%;width:auto;height:auto;max-height:260px;border-radius:8px;display:block;cursor:zoom-in"></a>`;
      return `📎 <a href="${esc(url)}" target="_blank">${esc(att.name||tr('attachment'))}</a>`;
    }
    function chFmtTime(ts){ if(!ts) return ''; let s=String(ts).replace('T',' ').replace('Z','').replace(/\.\d+/,'').trim().slice(0,19); if(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(s)) s+=':00'; return s; }
    function csToast(message){
      let c=document.getElementById('cs-toast-wrap');
      if(!c){ c=document.createElement('div'); c.id='cs-toast-wrap';
        c.style.cssText='position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:100000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none';
        document.body.appendChild(c); }
      const t=document.createElement('div'); t.textContent=message;
      t.style.cssText='background:#2563eb;color:#fff;font-weight:700;font-size:14px;text-align:center;padding:12px 28px;border-radius:8px;box-shadow:0 8px 24px rgba(37,99,235,.35);opacity:0;transform:translateY(-8px);transition:opacity .18s ease,transform .18s ease';
      c.appendChild(t);
      requestAnimationFrame(()=>{ t.style.opacity='1'; t.style.transform='translateY(0)'; });
      setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(-8px)'; setTimeout(()=>t.remove(),200); },2200);
    }
    async function api(method, path, body){
      const r=await fetch(`/api/public/consult${path}${path.includes('?')?'&':'?'}h=${H}`,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
      const d=await r.json().catch(()=>({})); if(!r.ok||!d.ok) throw new Error(d.error||tr('requestFailed')); return d;
    }
    (async()=>{ try{ const m=await api('GET',`/chat/meta?p=${POST}`); $('hosTitle').textContent=m.hospital_name+' '+tr('chat'); $('chatTitle').textContent=m.title||tr('chat'); }catch{} })();

    $('codeToggle').onclick=function(){ const c=$('code'); c.type=c.type==='password'?'text':'password'; this.textContent=c.type==='password'?'👁':'🙈'; };
    $('sendBtn').onclick=async()=>{ const email=$('email').value.trim(); if(!email) return MxAlert.error(tr('enterEmail'));
      try{ await api('POST','/send-code',{email,language:LANG,p:POST}); $('sendBtn').textContent=tr('resend'); csToast(tr('codeSent')); $('code').focus(); }catch(e){ MxAlert.error(e.message); } };
    $('joinBtn').onclick=async()=>{ const email=$('email').value.trim(), code=$('code').value.trim();
      if(!email||!code) return MxAlert.error(tr('enterCredentials'));
      try{ const d=await api('POST','/chat/join',{email,code,p:POST,language:LANG}); chatToken=d.chatToken; convId=d.conversationId;
        $('authCard').classList.add('hidden');
        if(d.knownCustomer){ enterChat(); }       // 등록 고객 → 국적 언어 자동 적용
        else { await showLangStep(); }             // 미등록 고객 → 번역 언어 선택
      }catch(e){ MxAlert.error(e.message); } };

    // ── 번역 언어 선택 (미등록 고객) ──────────────────────────
    async function showLangStep(){
      $('langCard').classList.remove('hidden');
      try{
        const o=await api('GET','/chat/lang-options');
        const sel=$('langSel'); sel.innerHTML='';
        (o.fromCustomers||[]).forEach(l=>{ const op=document.createElement('option'); op.value=l.code; op.textContent=l.label; sel.appendChild(op); });
        const etc=document.createElement('option'); etc.value='other'; etc.textContent=tr('otherOption'); sel.appendChild(etc);
        const os=$('otherSel'); os.innerHTML='';
        (o.all||[]).forEach(l=>{ const op=document.createElement('option'); op.value=l.code; op.textContent=l.label; os.appendChild(op); });
        sel.onchange=()=>{ $('otherWrap').style.display = sel.value==='other' ? 'block' : 'none'; };
        sel.onchange();
      }catch(e){ /* 옵션 로드 실패해도 기타 선택 가능 */ }
    }
    $('needYes').onclick=()=>{ $('langSelectWrap').style.display='block'; };
    $('needNo').onclick=async()=>{ await setLang('ko'); enterChat(); };  // 번역 불필요 → 스탭 언어(번역 스킵)
    $('langConfirm').onclick=async()=>{
      const sel=$('langSel'); const lang = sel.value==='other' ? $('otherSel').value : sel.value;
      await setLang(lang||'en'); enterChat();
    };
    async function setLang(lang){
      try{ await api('POST','/chat/set-lang',{chatToken,lang}); }catch(e){ /* 비치명적 */ }
    }
    function enterChat(){
      $('langCard').classList.add('hidden');
      $('chatCard').classList.remove('hidden');
      connect();
    }

    document.querySelectorAll('input[name="translateMode"]').forEach(el=>el.onchange=e=>{
      showBoth=e.target.value==='both';
      document.querySelectorAll('.ch-orig').forEach(x=>x.style.display=showBoth?'block':'none');
    });
    function dualTextHtml(primary, secondary, secondaryLabel){
      let html=esc(primary||'').replace(/\n/g,'<br>');
      if(secondary){
        html+=`<div class="ch-orig" style="display:${showBoth?'block':'none'}"><strong>${secondaryLabel}</strong><br>${esc(secondary).replace(/\n/g,'<br>')}</div>`;
      }
      return html;
    }

    function render(m){
      const mine = m.sender_type==='customer';
      // 표시: 상대→번역 우선, 나→원문
      const primary = mine ? (m.original_text||'') : (m.translated_text || m.original_text || '');
      const secondary = mine
        ? (m.translated_text || null)
        : (m.translated_text && m.original_text ? m.original_text : null);
      const secondaryLabel = mine ? tr('translation') : tr('original');
      let inner='';
      if(m.attachment){ inner=`<div class="ch-att">${attachHtml(m.attachment)}</div>`; }
      else inner=dualTextHtml(primary, secondary, secondaryLabel);
      const div=document.createElement('div'); div.className='ch-msg'+(mine?' me':''); if(m.id) div.dataset.mid=m.id;
      const showUnread = mine && Number(m.unread) > 0;
      div.innerHTML=`<div style="display:flex;flex-direction:column;max-width:80%;${mine?'align-items:flex-end':'align-items:flex-start'}"><div class="ch-bubble">${inner}</div><div style="font-size:10px;color:#9ca3af;margin-top:2px"><span class="ch-unread" style="color:#f59e0b;font-weight:700;margin-right:4px">${showUnread?'1':''}</span>${chFmtTime(m.created_at)}</div></div>`;
      $('msgs').appendChild(div); $('msgs').scrollTop=$('msgs').scrollHeight;
    }

    function connect(){
      socket=io({ auth:{ chatToken } });
      socket.on('connect',()=>socket.emit('chat:join',{conversationId:convId}));
      socket.on('chat:history',d=>{ $('msgs').innerHTML=''; d.messages.forEach(render); socket.emit('chat:read',{conversationId:convId}); });
      socket.on('chat:message',m=>{ if(m.conversation_id===convId){ render(m); socket.emit('chat:read',{conversationId:convId}); } });
      socket.on('chat:read',d=>{ if(d.conversationId===convId && d.by!=='customer'){ document.querySelectorAll('#msgs .ch-unread').forEach(el=>el.textContent=''); } });
      socket.on('chat:error',e=>MxAlert.error(e.message));
    }
    function send(){ const t=$('msgInput').value.trim(); if(!t||!socket) return; socket.emit('chat:message',{conversationId:convId,text:t}); $('msgInput').value=''; }
    $('sendMsgBtn').onclick=send;
    $('msgInput').addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });

    // 파일 업로드 (드래그 & 드롭 + 클릭)
    const dz=$('dropZone');
    dz.onclick=()=>$('fileInput').click();
    $('fileInput').onchange=e=>{ if(e.target.files[0]) upload(e.target.files[0]); e.target.value=''; };
    ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over');}));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over');}));
    dz.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) upload(f); });
    async function upload(file){
      const fd=new FormData(); fd.append('file',file);
      try{ const r=await fetch(`/api/public/consult/conversations/${convId}/upload?h=${H}&token=${encodeURIComponent(chatToken)}`,{method:'POST',body:fd});
        const d=await r.json().catch(()=>({})); if(!r.ok||!d.ok) throw new Error(d.error||tr('uploadFailed')); }catch(e){ MxAlert.error(e.message); }
    }
  </script>
</body>
</html>
