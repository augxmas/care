<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전문 외국환자관리 CRM</title><link rel="stylesheet" href="/css/common.css"><script src="/js/alert.js"></script><script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>html,body{margin:0;min-height:100%;background:#f5f5f5;color:#18181b}.wrap{width:min(820px,92%);margin:40px auto}.card{background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{box-sizing:border-box;width:100%;border:1px solid #d4d4d8;border-radius:8px;padding:11px}.field input[readonly]{background:#f4f4f5;color:#52525b;cursor:not-allowed}.field input.invalid{border-color:#dc2626;background:#fef2f2}.validation-error{display:none;color:#dc2626;font-size:11px;margin-top:5px}.validation-error.visible{display:block}.span2{grid-column:span 2}.required{color:#dc2626}.btn{border:1px solid #d4d4d8;border-radius:8px;padding:10px 14px;background:#fff;cursor:pointer}.submit{width:100%;background:#111;color:#fff;margin-top:22px;padding:13px}.notice{background:#f4f4f5;border-radius:8px;padding:12px;font-size:13px;margin:16px 0}body.embed .wrap{margin:20px auto}body.embed .wrap>div{display:none}body.embed #submitBtn{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.span2{grid-column:auto}}</style></head>
<body><main class="wrap"><div style="text-align:center;margin-bottom:24px"><h1>병원 등록 신청</h1><p>병원 정보는 대행사 계정과 별도로 관리됩니다.</p></div><section class="card"><form id="form" enctype="multipart/form-data"><div class="grid" id="fields"></div><div class="notice">일련번호는 등록일 기준 <b>yyyymmdd_nnnn</b> 형식으로 자동 생성되며 ‘승인요청’ 상태로 접수됩니다.</div><button class="btn submit" id="submitBtn">병원 등록 신청</button></form></section></main>
<script>
const fields=document.getElementById('fields'),form=document.getElementById('form'),submitBtn=document.getElementById('submitBtn');
const labels={company_name:'병원명',company_name_en:'병원명(en)',hospital_id:'병원ID',ceo_name:'대표자',business_no:'사업자등록번호',biz_cert:'사업자등록증',representative_phone:'대표전화',address1:'주소1',address2:'주소2',postal_code:'우편번호',medical_subjects:'진료과목',fax:'팩스',homepage:'홈페이지',contact_name:'담당자명',contact_mobile:'담당자 모바일폰',contact_email:'담당자 이메일'},types={contact_email:'email',homepage:'url',biz_cert:'file'},spans=new Set(['address1','address2','medical_subjects']);
async function init(){const r=await fetch('/api/admin/hospital-form-config/public'),d=await r.json();fields.innerHTML=d.data.map(f=>{const k=f.field_key,req=f.required?'required':'',star=f.required?'<span class="required">*</span>':'';if(k==='serial_no')return `<div class="field span2"><label>일련번호</label><div class="notice" style="margin:0">등록 완료 시 자동 생성됩니다.</div></div>`;if(k==='biz_cert')return `<div class="field span2"><label>${labels[k]} ${star}</label><input type="file" name="${k}" accept=".pdf,.jpg,.jpeg,.png" ${req}></div>`;const readonly=k==='postal_code'?'readonly':'';return `<div class="field ${spans.has(k)?'span2':''}"><label>${labels[k]} ${star}</label><div style="display:flex;gap:7px"><input type="${types[k]||'text'}" name="${k}" ${req} ${readonly}>${k==='address1'?'<button type="button" class="btn" onclick="addressSearch()">카카오 주소검색</button>':''}</div>${['homepage','contact_email'].includes(k)?`<small class="validation-error" data-error-for="${k}"></small>`:''}</div>`}).join('');configureValidation()}
function digits(value,max){return String(value||'').replace(/\D/g,'').slice(0,max)}
function formatBusiness(value){const d=digits(value,10);return d.length===10?`${d.slice(0,3)}-${d.slice(3,5)}-${d.slice(5)}`:d}
function formatPhone(value){const d=digits(value,11);if(d.startsWith('02')){if(d.length===11)return `02-${d.slice(2,6)}-${d.slice(6)}`;if(d.length===10)return `02-${d.slice(2,6)}-${d.slice(6)}`;if(d.length===9)return `02-${d.slice(2,5)}-${d.slice(5)}`}if(d.length===11)return `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;if(d.length===10)return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;return d}
function formatMobile(value){const d=digits(value,11);return d.length===11?`${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`:d}
function showValidation(input,message){input.setCustomValidity(message);input.classList.toggle('invalid',Boolean(message));let el=document.querySelector(`[data-error-for="${input.name}"]`);if(!el){el=document.createElement('small');el.className='validation-error';el.dataset.errorFor=input.name;input.closest('.field')?.appendChild(el)}el.textContent=message;el.classList.toggle('visible',Boolean(message))}
function validateLive(input){const value=input.value.trim();if(!value)return showValidation(input,'');if(input.name==='contact_email'){showValidation(input,/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)?'':'올바른 이메일 형식으로 입력하세요.')}if(input.name==='homepage'){let ok=false;try{const u=new URL(value);ok=['http:','https:'].includes(u.protocol)&&Boolean(u.hostname.includes('.'))}catch{}showValidation(input,ok?'':'홈페이지는 http:// 또는 https://로 시작하는 올바른 주소여야 합니다.')}}
function configureValidation(){const configs={business_no:{max:10,format:formatBusiness},representative_phone:{max:11,format:formatPhone},fax:{max:11,format:formatPhone},contact_mobile:{max:11,format:formatMobile}};Object.entries(configs).forEach(([name,c])=>{const input=document.querySelector(`[name="${name}"]`);if(!input)return;input.inputMode='numeric';input.addEventListener('input',()=>{input.value=digits(input.value,c.max);showValidation(input,'')});input.addEventListener('blur',()=>{input.value=c.format(input.value);if(name==='contact_mobile'&&input.value&&!/^010-\d{4}-\d{4}$/.test(input.value))showValidation(input,'담당자 모바일폰은 010-####-#### 형식으로 입력하세요.')})});['homepage','contact_email'].forEach(name=>{const input=document.querySelector(`[name="${name}"]`);if(input){input.addEventListener('input',()=>validateLive(input));input.addEventListener('blur',()=>validateLive(input))}})}
function addressSearch(){new daum.Postcode({oncomplete:d=>{const p=document.querySelector('[name=postal_code]'),a=document.querySelector('[name=address1]'),a2=document.querySelector('[name=address2]');if(p)p.value=d.zonecode;if(a)a.value=d.roadAddress||d.jibunAddress;if(a2)a2.focus()}}).open()}
form.onsubmit=async e=>{e.preventDefault();submitBtn.disabled=true;try{const r=await fetch('/api/admin/hospitals/register',{method:'POST',body:new FormData(form)}),d=await r.json();if(!r.ok)throw Error(d.error||'등록하지 못했습니다.');form.innerHTML=`<div style="text-align:center;padding:50px 10px"><h2>병원 등록 신청이 완료되었습니다.</h2><p>일련번호: <b>${d.serial_no}</b></p><p>현재 상태: 승인요청</p></div>`;if(window.parent!==window)window.parent.postMessage({type:'hospital-registered',id:d.id},window.location.origin)}catch(err){await MxAlert.error(err.message,{title:'등록 실패'});submitBtn.disabled=false}};
const isEmbed=new URLSearchParams(location.search).get('embed')==='1';if(isEmbed)document.body.classList.add('embed');
window.addEventListener('message',event=>{if(event.origin===location.origin&&event.data?.type==='submit-hospital-registration')form.requestSubmit()});
init();
</script></body></html>
