<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>병원 대행 승인 요청</title><link rel="stylesheet" href="/css/common.css"><script src="/js/alert.js"></script>
<style>
body{margin:0;background:#f4f6f8;color:#18181b;font-family:Arial,sans-serif}.wrap{width:min(620px,92%);margin:60px auto}.card{background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:30px;box-shadow:0 8px 25px #0001}.title{text-align:center}.info{width:100%;border-collapse:collapse;margin:24px 0}.info th,.info td{padding:12px;border-bottom:1px solid #eee;text-align:left}.info th{width:150px;background:#fafafa}.actions{display:flex;justify-content:center;gap:10px}.btn{border:1px solid #d4d4d8;border-radius:8px;padding:11px 20px;background:#fff;cursor:pointer}.green{background:#15803d;color:#fff}.red{background:#b91c1c;color:#fff}.result{text-align:center;padding:30px 10px}.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#fef3c7}
</style></head><body><main class="wrap"><section class="card"><div id="content"><div class="title"><h1>병원 대행 승인 요청</h1><p>요청 내용을 확인한 후 승인 또는 반려해 주세요.</p></div><table class="info"><tr><th>요청 대행사</th><td id="agencyName"></td></tr><tr><th>병원명</th><td id="hospitalName"></td></tr><tr><th>사업자등록번호</th><td id="businessNo"></td></tr><tr><th>병원 일련번호</th><td id="serialNo"></td></tr><tr><th>현재 상태</th><td id="status"></td></tr></table><div class="actions" id="actions"><button class="btn red" id="rejectBtn">반려</button><button class="btn green" id="approveBtn">승인</button></div></div></section></main>
<script>
const $=id=>document.getElementById(id),token=location.pathname.split('/').filter(Boolean).pop(),labels={pending:'승인대기',approved:'승인',rejected:'반려'};
async function api(url,opt){const r=await fetch(url,opt),type=r.headers.get('content-type')||'',d=type.includes('application/json')?await r.json():{};if(!r.ok)throw Error(d.error||'요청을 처리하지 못했습니다.');return d}
async function load(){try{const d=(await api('/api/admin/hospital-agency-request/'+encodeURIComponent(token))).data;$('agencyName').textContent=d.agency_name;$('hospitalName').textContent=d.hospital_name;$('businessNo').textContent=d.business_no;$('serialNo').textContent=d.serial_no;$('status').innerHTML=`<span class="badge">${labels[d.status]||d.status}</span>`;$('actions').style.display=d.status==='pending'?'flex':'none'}catch(e){$('content').innerHTML=`<div class="result"><h2>요청을 확인할 수 없습니다.</h2><p>${e.message}</p></div>`}}
async function respond(decision){const approved=decision==='approved';const confirmed=await MxAlert.confirm(approved?'이 병원의 대행사 요청을 승인하시겠습니까?':'이 병원의 대행사 요청을 반려하시겠습니까?',{title:approved?'대행 요청 승인':'대행 요청 반려',type:approved?'success':'warning',confirmText:approved?'승인':'반려',confirmColor:approved?'success':'danger'});if(!confirmed)return;try{await api('/api/admin/hospital-agency-request/'+encodeURIComponent(token)+'/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision})});$('content').innerHTML=`<div class="result"><h2>${approved?'승인':'반려'} 처리가 완료되었습니다.</h2><p>${approved?'병원과 대행사의 관계가 성립되었습니다.':'대행 요청을 반려했습니다.'}</p></div>`}catch(e){await MxAlert.error(e.message,{title:'처리 실패'})}}
$('approveBtn').onclick=()=>respond('approved');$('rejectBtn').onclick=()=>respond('rejected');load();
</script></body></html>
