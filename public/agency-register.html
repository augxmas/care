<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전문 외국환자관리 CRM</title><link rel="stylesheet" href="/css/common.css"><script src="/js/alert.js"></script><script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
html,body{margin:0;min-height:100%;background:#f5f5f5;color:#18181b}.wrap{width:min(820px,92%);margin:35px auto}.title{text-align:center}.card{background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{box-sizing:border-box;width:100%;border:1px solid #d4d4d8;border-radius:8px;padding:11px}.span2{grid-column:span 2}.required{color:#dc2626}.btn{border:1px solid #d4d4d8;border-radius:8px;padding:10px 14px;background:#fff;cursor:pointer}.submit{width:100%;background:#111;color:#fff;margin-top:22px}.embed .wrap{margin:20px auto}.embed .title,.embed #submitBtn{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.span2{grid-column:auto}}
</style></head><body><main class="wrap"><div class="title"><h1>대행사 등록 신청</h1></div><section class="card"><form id="form" enctype="multipart/form-data"><div class="grid" id="fields"></div><button class="btn submit" id="submitBtn">대행사 등록 신청</button></form></section></main>
<script>
const fields=document.getElementById('fields'),form=document.getElementById('form'),submitBtn=document.getElementById('submitBtn'),labels={company_name:'대행사명',company_name_en:'대행사명(en)',ceo_name:'대표자',business_no:'사업자등록번호',biz_cert:'사업자등록증',contact_phone:'대표전화',address1:'주소1',address2:'주소2',postal_code:'우편번호',contact_name:'담당자명',contact_mobile:'담당자 모바일폰',contact_email:'담당자 이메일',bank_name:'은행',bank_account:'계좌번호'};
async function init(){const r=await fetch('/api/admin/agency-form-config/public'),d=await r.json();fields.innerHTML=d.data.map(f=>{const k=f.field_key,req=f.required?'required':'',star=f.required?'<span class="required">*</span>':'';if(k==='biz_cert')return `<div class="field span2"><label>${labels[k]} ${star}</label><input type="file" name="${k}" ${req}></div>`;return `<div class="field ${['address1','address2'].includes(k)?'span2':''}"><label>${labels[k]} ${star}</label><div style="display:flex;gap:7px"><input name="${k}" type="${k==='contact_email'?'email':'text'}" ${k==='postal_code'?'readonly':''} ${req}>${k==='address1'?'<button type="button" class="btn" onclick="addressSearch()">카카오 주소검색</button>':''}</div></div>`}).join('');configure()}
const digits=(v,n)=>String(v||'').replace(/\D/g,'').slice(0,n);function configure(){[['business_no',10],['contact_phone',11],['contact_mobile',11]].forEach(([name,max])=>{const x=document.querySelector(`[name="${name}"]`);if(x)x.oninput=()=>x.value=digits(x.value,max)});const account=document.querySelector('[name=bank_account]');if(account)account.oninput=()=>account.value=account.value.replace(/[^0-9-]/g,'')}
function addressSearch(){new daum.Postcode({oncomplete:d=>{document.querySelector('[name=postal_code]').value=d.zonecode;document.querySelector('[name=address1]').value=d.roadAddress||d.jibunAddress}}).open()}
form.onsubmit=async e=>{e.preventDefault();submitBtn.disabled=true;try{const r=await fetch('/api/admin/agencies/register',{method:'POST',body:new FormData(form)}),d=await r.json();if(!r.ok)throw Error(d.error||'등록하지 못했습니다.');form.innerHTML='<div style="text-align:center;padding:50px"><h2>대행사 등록 신청이 완료되었습니다.</h2><p>현재 상태: 승인요청</p></div>';parent.postMessage({type:'agency-registered'},location.origin)}catch(e){await MxAlert.error(e.message,{title:'등록 실패'});submitBtn.disabled=false}};
if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embed');window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='submit-agency-registration')form.requestSubmit()});init();
</script></body></html>
